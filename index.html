la ley les da ese carácter; las localidades son divisiones de los distritos.","Comunas y resguardos no aparecen como entidades territoriales en el art. 286."],"concepto":"Entidades territoriales (art. 286)."},{"id":"1.6-07","nivel":2,"tipo":"multiple","enunciado":"Un servidor de una entidad administrativa decide “resolver” un conflicto entre dos particulares sobre la propiedad de un predio, sin que ninguna norma le asigne esa función. Según el artículo 121:","opciones":["Puede hacerlo si ambas partes están de acuerdo.","Ninguna autoridad puede ejercer funciones distintas de las que le atribuyen la Constitución y la ley.","Puede hacerlo si su jefe lo autoriza verbalmente.","Puede hacerlo porque toda autoridad debe resolver los conflictos que conozca."],"correcta":1,"explicaciones":["El acuerdo de las partes no le otorga competencia a una autoridad.","Correcto: art. 121.","Un jefe no puede atribuir competencias que la ley no asigna.","Las autoridades solo actúan dentro de sus competencias."],"concepto":"Art. 121: legalidad de las competencias."},{"id":"1.6-08","nivel":3,"tipo":"multiple","enunciado":"Que el Procurador sea elegido por el Senado de una terna en la que intervienen el Presidente, la Corte Suprema y el Consejo de Estado es una expresión del principio de:","opciones":["Subordinación de la Procuraduría al Congreso.","Colaboración armónica entre los órganos del Estado.","Centralización administrativa.","Delegación de funciones."],"correcta":1,"explicaciones":["La Procuraduría es autónoma e independiente; no está subordinada al Congreso.","Correcto: art. 113, funciones separadas pero colaboración armónica.","La centralización se refiere a la concentración de funciones administrativas.","La delegación es la transferencia de funciones de un superior a un subalterno."],"concepto":"Colaboración armónica (art. 113)."},{"id":"1.6-09","nivel":3,"tipo":"multiple","enunciado":"La ley que regula los mecanismos de participación ciudadana o los derechos fundamentales debe ser:","opciones":["Una ley orgánica, aprobada por mayoría simple.","Una ley estatutaria, aprobada por mayoría absoluta en una sola legislatura y con revisión previa de la Corte Constitucional.","Un decreto ley expedido por el Presidente con facultades extraordinarias.","Una ley marco que el Gobierno desarrolla por decreto."],"correcta":1,"explicaciones":["Las leyes orgánicas regulan otras materias (reglamento del Congreso, presupuesto, ordenamiento territorial).","Correcto: art. 152 y siguientes.","Las facultades extraordinarias no pueden usarse para expedir leyes estatutarias.","Las leyes marco regulan materias como crédito público o comercio exterior."],"concepto":"Leyes estatutarias (art. 152)."},{"id":"1.6-10","nivel":3,"tipo":"multiple","enunciado":"El Gobierno nacional está formado, según el artículo 115, por:","opciones":["El Presidente y el Vicepresidente.","El Presidente, los ministros del despacho y los directores de departamentos administrativos.","El Presidente, los gobernadores y los alcaldes.","El Presidente, el Congreso y las altas cortes."],"correcta":1,"explicaciones":["La definición incluye a ministros y directores de departamentos administrativos.","Correcto: art. 115.","Gobernaciones y alcaldías hacen parte de la Rama Ejecutiva, pero no del Gobierno nacional.","Congreso y altas cortes son otras ramas."],"concepto":"Gobierno nacional (art. 115)."},{"id":"1.6-11","nivel":3,"tipo":"multiple","enunciado":"¿Cuál de las siguientes entidades NO hace parte de la Rama Judicial?","opciones":["La Fiscalía General de la Nación.","La Comisión Nacional de Disciplina Judicial.","La Procuraduría General de la Nación.","El Consejo de Estado."],"correcta":2,"explicaciones":["La Fiscalía sí hace parte de la Rama Judicial (art. 116).","La Comisión Nacional de Disciplina Judicial sí está en el art. 116.","Correcto: la Procuraduría es un órgano de control autónomo.","El Consejo de Estado sí hace parte de la Rama Judicial."],"concepto":"Composición de la Rama Judicial (art. 116)."},{"id":"1.6-12","nivel":4,"tipo":"multiple","enunciado":"Según el artículo 116, los particulares pueden ser investidos de la función de administrar justicia:","opciones":["De forma permanente, como jueces de paz y notarios.","Transitoriamente, en condición de jurados, conciliadores o árbitros.","Solo en asuntos penales, como fiscales ad hoc.","Nunca, porque es una función exclusiva del Estado."],"correcta":1,"explicaciones":["La regla constitucional habla de investidura transitoria; los notarios no administran justicia.","Correcto: art. 116, inciso final.","La Constitución no prevé fiscales particulares.","La Constitución sí lo permite transitoriamente."],"concepto":"Particulares que administran justicia (art. 116)."},{"id":"1.6-13","nivel":4,"tipo":"multiple","enunciado":"El estado de conmoción interior puede declararse por un término de hasta 90 días, prorrogable por dos periodos iguales. ¿Qué se exige para la segunda prórroga?","opciones":["La firma del Procurador General de la Nación.","El concepto previo y favorable del Senado.","Una consulta popular nacional.","La aprobación previa de la Corte Constitucional."],"correcta":1,"explicaciones":["La Procuraduría no autoriza prórrogas de estados de excepción.","Correcto: art. 213.","No se exige consulta popular.","La Corte hace control automático de los decretos, no aprobación previa de la prórroga."],"concepto":"Conmoción interior (art. 213)."},{"id":"1.6-14","nivel":4,"tipo":"multiple","enunciado":"Durante un estado de excepción, según el artículo 214:","opciones":["Pueden suspenderse temporalmente los derechos fundamentales.","No pueden suspenderse los derechos humanos ni las libertades fundamentales.","Se suspende el funcionamiento del Congreso.","Los decretos legislativos no tienen control judicial."],"correcta":1,"explicaciones":["La Constitución lo prohíbe expresamente.","Correcto: art. 214, numeral 2.","No se interrumpe el funcionamiento de las ramas ni de los órganos del Estado.","La Corte Constitucional los revisa automáticamente."],"concepto":"Límites de los estados de excepción (art. 214)."},{"id":"1.6-15","nivel":5,"tipo":"multiple","enunciado":"Según el artículo 115, forman parte de la Rama Ejecutiva:","opciones":["Las gobernaciones, las alcaldías, las superintendencias, los establecimientos públicos y las empresas industriales y comerciales del Estado.","Las asambleas, los concejos, las gobernaciones y las alcaldías.","Las superintendencias, las contralorías territoriales y las personerías.","Las empresas industriales y comerciales del Estado, el Banco de la República y la Registraduría."],"correcta":0,"explicaciones":["Correcto: último inciso del art. 115.","Asambleas y concejos son corporaciones administrativas de elección popular, no gobernaciones ni alcaldías.","Contralorías y personerías son órganos de control.","El Banco de la República y la Registraduría son órganos autónomos."],"concepto":"Composición de la Rama Ejecutiva (art. 115)."},{"id":"1.6-16","nivel":5,"tipo":"multiple","enunciado":"Respecto del estado de emergencia económica, social y ecológica (art. 215), es correcto afirmar que:","opciones":["Puede declararse por periodos de hasta 90 días, prorrogables indefinidamente.","Puede declararse por periodos de hasta 30 días que, sumados, no excedan 90 días en el año calendario.","Solo puede declararse con autorización previa del Congreso.","Permite al Gobierno desmejorar los derechos sociales de los trabajadores."],"correcta":1,"explicaciones":["No corresponde a la regla del art. 215.","Correcto: art. 215.","Lo declara el Presidente con la firma de todos los ministros; el Congreso ejerce control posterior.","El art. 215 prohíbe expresamente desmejorar los derechos sociales de los trabajadores."],"concepto":"Emergencia económica, social y ecológica (art. 215)."}]},{"id":"1.7","titulo":"Función pública, carrera administrativa y principios de la función administrativa","normas":["Constitución Política: arts. 83–84, 90, 122–130, 209, 211, 279","Ley 489 de 1998 (organización de la administración)","Ley 678 de 2001 (acción de repetición)","Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021 (régimen de la PGN)"],"objetivos":["Definir quiénes son servidores públicos (art. 123) y distinguir empleados públicos de trabajadores oficiales.","Explicar el mérito y la carrera (art. 125), sus excepciones y causales de retiro, y la carrera especial de la Procuraduría.","Aplicar las prohibiciones constitucionales a los servidores: nepotismo (art. 126), contratos y política (art. 127), doble asignación (art. 128) y honores extranjeros (art. 129).","Manejar los principios de la función administrativa (art. 209), la buena fe (art. 83), la prohibición de requisitos adicionales (art. 84) y la responsabilidad patrimonial (art. 90)."],"explicacion":[{"subtitulo":"1. ¿Quién es servidor público? (arts. 122 y 123)","parrafos":["<b>Servidores públicos<\/b> son los <b>miembros de las corporaciones públicas<\/b> (congresistas, diputados, concejales, ediles), los <b>empleados<\/b> y los <b>trabajadores del Estado<\/b> y de sus entidades descentralizadas territorialmente y por servicios. Están al servicio del Estado y de la comunidad, y ejercen sus funciones en la forma prevista por la Constitución, la ley y el reglamento.","<b>Empleado público<\/b>: vinculado por una relación <b>legal y reglamentaria<\/b> (nombramiento y posesión). <b>Trabajador oficial<\/b>: vinculado por <b>contrato de trabajo<\/b> (por ejemplo, en la construcción y sostenimiento de obras públicas o en empresas industriales y comerciales del Estado). Tú, como Técnico Administrativo de la PGN, serías <b>empleado público<\/b> de carrera.","<b>Art. 122<\/b>: no hay empleo público sin <b>funciones detalladas en ley o reglamento<\/b>; para proveer los remunerados deben estar en la <b>planta<\/b> y tener <b>presupuesto<\/b>. Ningún servidor entra a ejercer su cargo sin <b>prestar juramento<\/b> de cumplir y defender la Constitución. Debe <b>declarar bajo juramento sus bienes y rentas<\/b> antes de posesionarse, al retirarse o cuando la autoridad competente lo pida. Además, quienes hayan sido condenados por delitos que afecten el patrimonio del Estado no pueden ser servidores públicos ni contratar con el Estado (inhabilidad intemporal)."]},{"subtitulo":"2. Mérito y carrera (art. 125) y la carrera especial de la PGN","parrafos":["Regla general: los empleos del Estado <b>son de carrera<\/b>. Excepciones: los de <b>elección popular<\/b>, los de <b>libre nombramiento y remoción<\/b>, los de <b>trabajadores oficiales<\/b> y los demás que determine la ley. El ingreso y el ascenso se hacen por <b>concurso de méritos<\/b>. El retiro se produce por <b>calificación no satisfactoria<\/b> del desempeño, por <b>violación del régimen disciplinario<\/b> y por las demás causales de la Constitución o la ley. <b>La filiación política nunca determina el nombramiento, ascenso o remoción<\/b>.","<b>Art. 130<\/b>: la <b>Comisión Nacional del Servicio Civil (CNSC)<\/b> administra y vigila las carreras de los servidores, <b>excepto las de carácter especial<\/b>. La Procuraduría tiene una <b>carrera especial<\/b> de origen constitucional: el <b>art. 279<\/b> ordena a la ley regular el ingreso, concurso de méritos y retiro de sus servidores, lo que hace el <b>Decreto Ley 262 de 2000<\/b> (modificado por el Decreto Ley 1851 de 2021). Por eso, en la Convocatoria 252-2026, las listas las firma el jefe de la <b>Oficina de Selección y Carrera<\/b> y las apelaciones las resuelve la <b>Comisión de Carrera<\/b> de la PGN."]},{"subtitulo":"3. Prohibiciones constitucionales (arts. 126–129)","parrafos":["<b>Nepotismo (art. 126)<\/b>: el servidor no puede, en ejercicio de sus funciones, <b>nombrar, postular ni contratar<\/b> con parientes hasta el <b>cuarto grado de consanguinidad, segundo de afinidad o primero civil<\/b>, ni con su cónyuge o compañero permanente; tampoco con quienes intervinieron en su designación (ni con los parientes de estos). <b>Excepción<\/b>: los nombramientos hechos en aplicación de las normas vigentes sobre ingreso o ascenso <b>por méritos<\/b>.","<b>Art. 127<\/b>: los servidores no pueden celebrar contratos con entidades públicas o con particulares que manejen recursos públicos, salvo excepciones legales. A los empleados de la <b>Rama Judicial, de los órganos electorales, de control y de seguridad<\/b> les está <b>prohibido tomar parte en actividades de partidos y movimientos y en controversias políticas<\/b>, sin perjuicio de <b>ejercer libremente el derecho al sufragio<\/b>. Usar el empleo para presionar a los ciudadanos a respaldar una causa o campaña política es causal de mala conducta.","<b>Art. 128<\/b>: nadie puede desempeñar simultáneamente <b>más de un empleo público<\/b> ni recibir <b>más de una asignación del tesoro público<\/b>, salvo los casos expresamente determinados por la ley. <b>Art. 129<\/b>: los servidores no pueden aceptar cargos, honores o recompensas de gobiernos extranjeros u organismos internacionales, ni contratar con ellos, <b>sin previa autorización del Gobierno<\/b>."]},{"subtitulo":"4. Principios de la función administrativa (art. 209)","parrafos":["La función administrativa está al servicio de los <b>intereses generales<\/b> y se desarrolla con fundamento en los principios de <b>igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y publicidad<\/b> (truco [COMPLEMENTARIO]: “<b>I-M-E-E-C-I-P<\/b>”). Se ejerce mediante la <b>descentralización<\/b>, la <b>delegación<\/b> y la <b>desconcentración<\/b> de funciones; las autoridades deben coordinar sus actuaciones, y toda la administración tiene <b>control interno<\/b>.","<b>Descentralización<\/b>: se trasladan competencias a otra persona jurídica (territorial, como un municipio, o por servicios, como un establecimiento público). <b>Desconcentración<\/b>: se radican funciones en dependencias de la misma entidad, por ejemplo fuera de la sede principal, sin crear una nueva persona jurídica (como las procuradurías regionales y provinciales). <b>Delegación<\/b> (art. 211): un superior transfiere el ejercicio de una función a un subalterno; la delegación <b>exime de responsabilidad al delegante<\/b>, que corresponde al <b>delegatario<\/b>, aunque el delegante puede siempre reformar o revocar sus actos, reasumiendo la responsabilidad."]},{"subtitulo":"5. Buena fe, antitrámites y responsabilidad patrimonial","parrafos":["<b>Art. 83<\/b>: las actuaciones de particulares y autoridades deben ceñirse a la <b>buena fe<\/b>, que <b>se presume en las gestiones que los particulares adelanten ante las autoridades<\/b>. <b>Art. 84<\/b>: cuando un derecho o actividad ya está reglamentado de manera general, las autoridades <b>no pueden exigir permisos, licencias o requisitos adicionales<\/b>.","<b>Art. 90<\/b>: el Estado responde patrimonialmente por los <b>daños antijurídicos<\/b> que le sean imputables, causados por acción u omisión de sus autoridades. Si el Estado es condenado por un daño causado con <b>dolo o culpa grave<\/b> de un agente suyo, <b>debe repetir<\/b> contra este (<b>acción de repetición<\/b>, Ley 678 de 2001)."]}],"conceptos":[{"termino":"Servidor público","definicion":"Miembro de corporación pública, empleado o trabajador del Estado y de sus entidades descentralizadas (art. 123)."},{"termino":"Empleado público","definicion":"Servidor vinculado por relación legal y reglamentaria (nombramiento y posesión)."},{"termino":"Trabajador oficial","definicion":"Servidor vinculado por contrato de trabajo."},{"termino":"Carrera especial","definicion":"Sistema de carrera propio de ciertas entidades (como la PGN), no administrado por la CNSC (arts. 130 y 279)."},{"termino":"Nepotismo","definicion":"Prohibición de nombrar, postular o contratar con parientes (4.º consanguinidad, 2.º afinidad, 1.º civil) o cónyuge/compañero (art. 126)."},{"termino":"Delegación","definicion":"Transferencia del ejercicio de funciones a un subalterno; la responsabilidad pasa al delegatario (art. 211)."},{"termino":"Desconcentración","definicion":"Radicación de funciones en dependencias de la misma entidad, sin crear otra persona jurídica."},{"termino":"Descentralización","definicion":"Traslado de competencias a otra persona jurídica: territorial o por servicios."},{"termino":"Acción de repetición","definicion":"El Estado cobra al servidor lo que pagó por un daño causado con dolo o culpa grave de este (art. 90)."},{"termino":"Daño antijurídico","definicion":"Daño que la persona no tiene el deber jurídico de soportar."}],"confusiones":[{"concepto":"<b>Delegación<\/b>","seConfundeCon":"<b>Desconcentración<\/b>","diferencia":"En la delegación un superior transfiere a un subalterno el ejercicio de una función y la responsabilidad pasa al delegatario. En la desconcentración la ley o el reglamento radica funciones en dependencias de la misma entidad."},{"concepto":"<b>Desconcentración<\/b>","seConfundeCon":"<b>Descentralización<\/b>","diferencia":"Desconcentrar no crea otra persona jurídica; descentralizar sí traslada competencias a otra persona jurídica."},{"concepto":"Principios de la <b>función administrativa<\/b> (art. 209)","seConfundeCon":"Principios de la <b>seguridad social<\/b> (art. 48)","diferencia":"Art. 209: igualdad, moralidad, eficacia, economía, celeridad, imparcialidad, publicidad. Art. 48: eficiencia, universalidad, solidaridad."},{"concepto":"Prohibición de <b>política<\/b> (art. 127)","seConfundeCon":"Prohibición de <b>votar<\/b>","diferencia":"Los empleados de órganos de control no pueden participar en actividades de partidos ni controversias políticas, pero <b>sí pueden votar<\/b>."},{"concepto":"Nepotismo (art. 126)","seConfundeCon":"Nombramiento por concurso de méritos","diferencia":"La prohibición no aplica a los nombramientos hechos por mérito (concurso)."},{"concepto":"<b>Empleado<\/b> público","seConfundeCon":"<b>Trabajador<\/b> oficial","diferencia":"Empleado: nombramiento y posesión (legal y reglamentaria). Trabajador oficial: contrato de trabajo."}],"procuraduria":["La PGN tiene <b>carrera especial<\/b> (art. 279; Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021). Según la convocatoria 252-2026, las reclamaciones contra la lista de admitidos se presentan dentro de los <b>2 días hábiles<\/b> siguientes a su publicación ante el jefe de la Oficina de Selección y Carrera (art. 202 del Decreto Ley 262 de 2000), y la apelación la resuelve la <b>Comisión de Carrera<\/b>.","Como empleado de un <b>órgano de control<\/b>, el art. 127 te prohíbe participar en actividades de partidos y controversias políticas; solo puedes votar.","La Procuraduría vigila el cumplimiento de estas prohibiciones (nepotismo, doble asignación, participación en política) mediante el control disciplinario.","Las procuradurías regionales y provinciales son una expresión de la <b>desconcentración<\/b> de funciones de la PGN.","Los principios del art. 209 guían tu trabajo diario: celeridad en los trámites, publicidad de las actuaciones, imparcialidad con los usuarios y economía en el uso de recursos."],"altaProbabilidad":["Art. 123: quiénes son servidores públicos.","Art. 125: regla de carrera, excepciones, causales de retiro, no filiación política.","Art. 126: nepotismo (4.º, 2.º, 1.º) con excepción de concursos de méritos.","Art. 127: empleados de órganos de control no participan en política, pero votan.","Art. 128: un solo empleo y una sola asignación del tesoro público, salvo ley.","Art. 209: I-M-E-E-C-I-P; descentralización, delegación, desconcentración.","Art. 90: responsabilidad patrimonial y repetición por dolo o culpa grave."],"ejemplos":[{"titulo":"Participación en política","caso":"Un técnico de una procuraduría provincial publica, desde la cuenta institucional, mensajes de apoyo a un candidato a la alcaldía.","analisis":"Vulnera el art. 127: como empleado de un órgano de control no puede participar en controversias políticas. Puede votar, pero no hacer campaña."},{"titulo":"Requisitos adicionales","caso":"Para recibir una queja, una funcionaria exige al ciudadano una copia autenticada de la cédula que ningún procedimiento ni norma pide.","analisis":"Desconoce los arts. 83 y 84: se presume la buena fe y no se pueden exigir requisitos adicionales a los reglamentados."},{"titulo":"Doble asignación","caso":"Un técnico de carrera quiere aceptar, además, un contrato de trabajo de medio tiempo en una empresa industrial y comercial del Estado.","analisis":"Está prohibido por el art. 128, salvo que una ley lo permita expresamente."}],"repaso":["Servidores = miembros de corporaciones + empleados + trabajadores del Estado.","Carrera = regla; ingreso por concurso; retiro por mala calificación, falta disciplinaria u otras causales.","PGN = carrera especial (art. 279, DL 262/2000).","126 nepotismo · 127 contratos y política · 128 doble asignación · 129 honores extranjeros.","Art. 209: I-M-E-E-C-I-P. Art. 90: repetición por dolo o culpa grave."],"preguntas":[{"id":"1.7-01","nivel":1,"tipo":"multiple","enunciado":"Según el artículo 123, son servidores públicos:","opciones":["Solo los empleados de carrera administrativa.","Los miembros de las corporaciones públicas, los empleados y trabajadores del Estado y de sus entidades descentralizadas.","Todos los particulares que contratan con el Estado.","Solo los funcionarios de elección popular y los de libre nombramiento."],"correcta":1,"explicaciones":["La categoría es más amplia: incluye miembros de corporaciones, empleados de todo tipo y trabajadores oficiales.","Correcto: art. 123.","Los contratistas son particulares; algunos pueden cumplir funciones públicas transitoriamente, pero no son servidores por ese solo hecho.","Incluye también a empleados de carrera y trabajadores oficiales."],"concepto":"Servidores públicos (art. 123)."},{"id":"1.7-02","nivel":1,"tipo":"multiple","enunciado":"Según el artículo 125, la regla general es que los empleos en los órganos y entidades del Estado son:","opciones":["De libre nombramiento y remoción.","De carrera.","De periodo fijo.","De trabajadores oficiales."],"correcta":1,"explicaciones":["El libre nombramiento es una excepción.","Correcto: art. 125.","Los empleos de periodo son excepcionales.","Los de trabajadores oficiales son una excepción a la carrera."],"concepto":"Regla general de carrera (art. 125)."},{"id":"1.7-03","nivel":1,"tipo":"multiple","enunciado":"¿Cuál de los siguientes NO es un principio de la función administrativa según el artículo 209?","opciones":["Celeridad.","Imparcialidad.","Universalidad.","Publicidad."],"correcta":2,"explicaciones":["La celeridad sí está en el art. 209.","La imparcialidad sí está en el art. 209.","Correcto: la universalidad es un principio de la seguridad social (art. 48).","La publicidad sí está en el art. 209."],"concepto":"Principios del art. 209."},{"id":"1.7-04","nivel":2,"tipo":"multiple","enunciado":"Según el artículo 122, el servidor público debe declarar bajo juramento el monto de sus bienes y rentas:","opciones":["Solo al retirarse del cargo.","Antes de tomar posesión, al retirarse del cargo o cuando la autoridad competente se lo solicite.","Cada cinco años, mientras ocupe el cargo.","Solo si maneja recursos públicos."],"correcta":1,"explicaciones":["Es incompleto: también antes de posesionarse y cuando se lo pidan.","Correcto: art. 122.","La Constitución no fija esa periodicidad.","El deber aplica a todo servidor, no solo a quienes manejan recursos."],"concepto":"Declaración de bienes y rentas (art. 122)."},{"id":"1.7-05","nivel":2,"tipo":"multiple","enunciado":"Un técnico de carrera de la Procuraduría recibe una oferta para ocupar, al mismo tiempo, un empleo de medio tiempo en una gobernación. Según el artículo 128:","opciones":["Puede aceptarlo si los horarios no se cruzan.","No puede, porque nadie puede desempeñar simultáneamente más de un empleo público, salvo los casos expresamente determinados por la ley.","Puede aceptarlo con autorización escrita del Procurador.","Puede aceptarlo si renuncia a una de las dos remuneraciones."],"correcta":1,"explicaciones":["La compatibilidad de horarios no levanta la prohibición.","Correcto: art. 128.","Solo la ley puede establecer excepciones; no una autorización administrativa.","La prohibición incluye el desempeño simultáneo de empleos, no solo la doble remuneración."],"concepto":"Prohibición de doble empleo y doble asignación (art. 128)."},{"id":"1.7-06","nivel":2,"tipo":"multiple","enunciado":"Una técnica de la Procuraduría quiere participar como activista en la campaña de un candidato a la gobernación. Según el artículo 127:","opciones":["Puede hacerlo fuera del horario laboral.","No puede tomar parte en actividades de partidos ni controversias políticas, aunque sí puede votar.","Puede hacerlo si no usa recursos de la entidad.","No puede votar ni participar en política mientras sea servidora."],"correcta":1,"explicaciones":["La prohibición no depende del horario.","Correcto: los empleados de los órganos de control tienen esta prohibición, sin perjuicio del derecho al sufragio.","La prohibición es de participar, no solo de usar recursos.","Sí puede ejercer libremente el derecho al voto."],"concepto":"Prohibición de participación política (art. 127)."},{"id":"1.7-07","nivel":2,"tipo":"multiple","enunciado":"¿Cuál de las siguientes es una causal constitucional de retiro de un empleado de carrera (art. 125)?","opciones":["El cambio de gobierno.","La calificación no satisfactoria en el desempeño del empleo.","La pertenencia a un partido distinto al del nominador.","La decisión discrecional del jefe inmediato."],"correcta":1,"explicaciones":["El cambio de gobierno no es causal de retiro de la carrera.","Correcto: junto con la violación del régimen disciplinario y las demás causales legales.","La filiación política nunca determina la remoción.","El retiro de un empleado de carrera no es discrecional."],"concepto":"Causales de retiro en la carrera (art. 125)."},{"id":"1.7-08","nivel":3,"tipo":"multiple","enunciado":"Un jefe de dependencia quiere nombrar a su primo hermano (cuarto grado de consanguinidad) en un cargo de libre nombramiento de la misma entidad. Según el artículo 126:","opciones":["Puede hacerlo, porque la prohibición solo cubre hasta el segundo grado de consanguinidad.","No puede, porque la prohibición cubre parientes hasta el cuarto grado de consanguinidad.","Puede hacerlo si el primo cumple los requisitos del cargo.","Puede hacerlo si informa previamente a la Procuraduría."],"correcta":1,"explicaciones":["La prohibición llega al cuarto grado de consanguinidad.","Correcto: art. 126. La excepción solo aplica a nombramientos por concurso de méritos.","Cumplir requisitos no levanta la prohibición.","Informar no levanta la prohibición."],"concepto":"Nepotismo (art. 126)."},{"id":"1.7-09","nivel":3,"tipo":"multiple","enunciado":"¿Por qué la Comisión Nacional del Servicio Civil no administra la carrera de la Procuraduría General de la Nación?","opciones":["Porque la Procuraduría no tiene empleos de carrera.","Porque el artículo 130 exceptúa las carreras de carácter especial, y la de la PGN lo es por mandato del artículo 279.","Porque la Procuraduría pertenece a la Rama Judicial.","Porque la CNSC solo administra la carrera del orden territorial."],"correcta":1,"explicaciones":["La PGN sí tiene empleos de carrera, como el que se convoca en la 252-2026.","Correcto: carrera especial regulada por el Decreto Ley 262 de 2000.","La Procuraduría es un órgano de control, no de la Rama Judicial.","La CNSC administra carreras del orden nacional y territorial; la excepción es por carácter especial."],"concepto":"Carrera especial de la PGN (arts. 130 y 279)."},{"id":"1.7-10","nivel":3,"tipo":"multiple","enunciado":"El Estado fue condenado a pagar una indemnización por un daño causado por la conducta gravemente culposa de un servidor. Según el artículo 90, el Estado:","opciones":["Debe asumir el pago sin posibilidad de recobro.","Debe repetir contra el servidor.","Puede descontar el valor del salario del servidor sin proceso.","Debe pedir a la Procuraduría que pague con su presupuesto."],"correcta":1,"explicaciones":["Si hubo dolo o culpa grave, la Constitución ordena repetir.","Correcto: art. 90, acción de repetición (Ley 678 de 2001).","El recobro se hace mediante la acción de repetición, no con descuentos directos.","La PGN no paga las condenas de otras entidades."],"concepto":"Acción de repetición (art. 90)."},{"id":"1.7-11","nivel":3,"tipo":"multiple","enunciado":"Según el artículo 83, la buena fe:","opciones":["Debe ser probada por el particular en cada trámite.","Se presume en todas las gestiones que los particulares adelanten ante las autoridades.","Solo se presume en las actuaciones de las autoridades.","Se presume únicamente cuando el particular actúa por medio de abogado."],"correcta":1,"explicaciones":["Es al revés: se presume.","Correcto: art. 83.","La presunción opera a favor de los particulares en sus gestiones ante las autoridades.","No depende de actuar por medio de abogado."],"concepto":"Presunción de buena fe (art. 83)."},{"id":"1.7-12","nivel":4,"tipo":"multiple","enunciado":"Para radicar una solicitud ya reglamentada de forma general, un servidor exige a los usuarios un certificado adicional que no exige ninguna norma. Esta conducta desconoce principalmente:","opciones":["El artículo 84, que prohíbe exigir requisitos adicionales para actividades reglamentadas de manera general.","El artículo 128, que prohíbe la doble asignación.","El artículo 129, sobre honores de gobiernos extranjeros.","El artículo 125, sobre la carrera administrativa."],"correcta":0,"explicaciones":["Correcto: art. 84 (base constitucional de la política antitrámites).","No tiene relación con la doble asignación.","No tiene relación con honores extranjeros.","No tiene relación con la carrera."],"concepto":"Prohibición de requisitos adicionales (art. 84)."},{"id":"1.7-13","nivel":4,"tipo":"multiple","enunciado":"Un superior delega en un subalterno, conforme a la ley, la firma de ciertos actos. Según el artículo 211:","opciones":["El delegante sigue siendo el único responsable de los actos del delegatario.","La delegación exime de responsabilidad al delegante; la responsabilidad corresponde al delegatario, y el delegante puede reformar o revocar sus actos.","El delegatario puede subdelegar libremente la función recibida.","El delegante pierde definitivamente la competencia sobre la función delegada."],"correcta":1,"explicaciones":["La Constitución dice lo contrario: la responsabilidad pasa al delegatario.","Correcto: art. 211.","La subdelegación no es libre; debe estar permitida por la ley.","El delegante puede reasumir y revocar los actos del delegatario."],"concepto":"Delegación (art. 211)."},{"id":"1.7-14","nivel":4,"tipo":"multiple","enunciado":"La existencia de procuradurías regionales y provinciales que ejercen funciones de la Procuraduría en distintas partes del país, sin ser personas jurídicas distintas, es un ejemplo de:","opciones":["Descentralización territorial.","Descentralización por servicios.","Desconcentración de funciones.","Delegación de funciones."],"correcta":2,"explicaciones":["La descentralización territorial traslada competencias a entidades territoriales con personería jurídica.","La descentralización por servicios crea entidades con personería jurídica (p. ej., establecimientos públicos).","Correcto: funciones radicadas en dependencias de la misma entidad, fuera de la sede principal.","La delegación es la transferencia del ejercicio de funciones de un superior a un subalterno."],"concepto":"Desconcentración frente a descentralización y delegación."},{"id":"1.7-15","nivel":5,"tipo":"multiple","enunciado":"Un servidor recibe de un gobierno extranjero una condecoración por su trabajo. Según el artículo 129, para aceptarla:","opciones":["Basta con informar a su jefe inmediato.","Requiere previa autorización del Gobierno.","Requiere autorización del Congreso de la República.","Puede aceptarla libremente si no tiene valor económico."],"correcta":1,"explicaciones":["No basta con informar; se requiere autorización.","Correcto: art. 129.","La autorización la da el Gobierno, no el Congreso.","La norma no distingue según el valor económico."],"concepto":"Honores de gobiernos extranjeros (art. 129)."},{"id":"1.7-16","nivel":5,"tipo":"multiple","enunciado":"¿Cuál es la diferencia entre un empleado público y un trabajador oficial?","opciones":["El empleado público se vincula por contrato de trabajo; el trabajador oficial, por nombramiento.","El empleado público se vincula por una relación legal y reglamentaria; el trabajador oficial, por contrato de trabajo.","Ambos se vinculan por nombramiento, pero el trabajador oficial no es servidor público.","El trabajador oficial siempre es de carrera; el empleado público, de libre nombramiento."],"correcta":1,"explicaciones":["Invierte las formas de vinculación.","Correcto: diferencia esencial entre ambas categorías.","El trabajador oficial sí es servidor público (art. 123) y se vincula por contrato.","Los trabajadores oficiales están exceptuados de la carrera (art. 125)."],"concepto":"Empleado público frente a trabajador oficial."},{"id":"1.7-17","nivel":3,"tipo":"multiple","enunciado":"Quien haya sido condenado por un delito que afecte el patrimonio del Estado, según el artículo 122:","opciones":["Puede ser designado servidor público cinco años después de cumplir la pena.","No puede ser designado servidor público ni celebrar contratos con el Estado.","Puede ser servidor público si repara integralmente el daño.","Solo está inhabilitado para cargos de elección popular."],"correcta":1,"explicaciones":["La Constitución no fija un plazo de rehabilitación para esta inhabilidad.","Correcto: inhabilidad intemporal del art. 122.","La reparación no levanta la inhabilidad constitucional.","Comprende inscribirse como candidato, ser elegido, ser designado servidor y contratar con el Estado."],"concepto":"Inhabilidad por delitos contra el patrimonio del Estado (art. 122)."}]},{"id":"1.8","titulo":"Organismos de control: Ministerio Público, Procuraduría, Defensoría y Contraloría","normas":["Constitución Política: arts. 117–118, 267–284","Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021","Ley 1952 de 2019, reformada por la Ley 2094 de 2021 (Código General Disciplinario)","Acto Legislativo 04 de 2019 (control fiscal)"],"objetivos":["Explicar qué es el Ministerio Público, quiénes lo ejercen y cuáles son sus tres grandes funciones (art. 118).","Conocer la elección, el periodo y las funciones del Procurador General (arts. 275–278), distinguiendo las que ejerce directamente.","Ubicar al Defensor del Pueblo dentro del Ministerio Público y sus funciones (arts. 281–282).","Diferenciar el control disciplinario (PGN) del control fiscal (Contraloría) y conocer la Auditoría General."],"explicacion":[{"subtitulo":"1. ¿Qué es el Ministerio Público? (arts. 117 y 118)","parrafos":["El <b>Ministerio Público<\/b> es, junto con la Contraloría General de la República, uno de los dos <b>órganos de control<\/b> del Estado (art. 117). Es autónomo e independiente: no pertenece a ninguna rama del poder.","Lo ejercen: el <b>Procurador General de la Nación<\/b>, el <b>Defensor del Pueblo<\/b>, los <b>procuradores delegados<\/b>, los <b>agentes del Ministerio Público ante las autoridades jurisdiccionales<\/b>, los <b>personeros municipales<\/b> y los demás funcionarios que determine la ley.","Le corresponden tres grandes tareas (art. 118): <b>(1) la guarda y promoción de los derechos humanos, (2) la protección del interés público y (3) la vigilancia de la conducta oficial<\/b> de quienes desempeñan funciones públicas. Truco [COMPLEMENTARIO]: “<b>Derechos – Interés público – Conducta<\/b>”."]},{"subtitulo":"2. El Procurador General (arts. 275–278)","parrafos":["Es el <b>supremo director del Ministerio Público<\/b> (art. 275). Lo elige el <b>Senado<\/b> para un periodo de <b>4 años<\/b>, de <b>terna<\/b> integrada por candidatos del <b>Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado<\/b> (art. 276).","<b>Art. 277 – funciones que ejerce por sí o por medio de sus delegados y agentes<\/b>: 1) vigilar el cumplimiento de la Constitución, las leyes, las decisiones judiciales y los actos administrativos; 2) proteger los derechos humanos y asegurar su efectividad, con el auxilio del Defensor del Pueblo; 3) defender los intereses de la sociedad; 4) defender los intereses colectivos, en especial el ambiente; 5) velar por el ejercicio diligente y eficiente de las funciones administrativas; 6) <b>ejercer vigilancia superior de la conducta oficial<\/b> de quienes desempeñen funciones públicas, <b>inclusive las de elección popular<\/b>; <b>ejercer preferentemente el poder disciplinario<\/b>; adelantar las investigaciones e imponer las sanciones conforme a la ley; 7) intervenir en los procesos y ante las autoridades judiciales o administrativas, cuando sea necesario en defensa del orden jurídico, del patrimonio público o de los derechos y garantías fundamentales; 8) rendir anualmente informe de su gestión al Congreso; 9) exigir a los funcionarios públicos y a los particulares la información que considere necesaria; 10) las demás que determine la ley. Para ello tiene <b>atribuciones de policía judicial<\/b> y puede <b>interponer las acciones que considere necesarias<\/b>.","<b>Art. 278 – funciones que ejerce directamente<\/b> (no delegables): 1) <b>desvincular del cargo, previa audiencia y mediante decisión motivada<\/b>, al funcionario que infrinja de manera manifiesta la Constitución o la ley, derive evidente e indebido provecho patrimonial, obstaculice gravemente las investigaciones u obre con manifiesta negligencia en investigar y sancionar faltas disciplinarias de sus empleados o en denunciar delitos; 2) emitir conceptos en los procesos disciplinarios contra funcionarios con fuero especial; 3) presentar proyectos de ley sobre materias de su competencia; 4) exhortar al Congreso para que expida leyes sobre derechos humanos; 5) <b>rendir concepto en los procesos de control de constitucionalidad<\/b>; 6) <b>nombrar y remover<\/b>, conforme a la ley, a los funcionarios y empleados de su dependencia.","<b>Art. 279<\/b>: la ley determina la estructura y el funcionamiento de la PGN, el ingreso y concurso de méritos, el retiro, las inhabilidades, incompatibilidades, calidades, remuneración y el régimen disciplinario de sus servidores (hoy, Decreto Ley 262 de 2000, modificado por el Decreto Ley 1851 de 2021). <b>Art. 280<\/b>: los agentes del Ministerio Público tienen las mismas calidades, categoría, remuneración, derechos y prestaciones que los magistrados y jueces de mayor jerarquía ante quienes ejercen su cargo. <b>Art. 284<\/b>: salvo excepciones constitucionales y legales, el Procurador y el Defensor pueden requerir a las autoridades la información necesaria <b>sin que pueda oponérseles reserva alguna<\/b>.","Contexto actual: el régimen disciplinario está en la <b>Ley 1952 de 2019<\/b>, reformada por la <b>Ley 2094 de 2021<\/b>. Tras la sentencia de la Corte Interamericana en el caso Petro Urrego vs. Colombia (2020), esa reforma y la Sentencia C-030 de 2023 de la Corte Constitucional ajustaron el régimen de sanciones a servidores de elección popular; lo estudiarás en detalle en la U8 (área disciplinar). <b>La Ley 734 de 2002 está derogada.<\/b>"]},{"subtitulo":"3. El Defensor del Pueblo (arts. 281–282)","parrafos":["El Defensor del Pueblo <b>forma parte del Ministerio Público<\/b> y ejerce sus funciones <b>bajo la suprema dirección del Procurador<\/b>. Lo elige la <b>Cámara de Representantes<\/b> para un periodo de <b>4 años<\/b>, de terna elaborada por el <b>Presidente<\/b> (art. 281).","Funciones (art. 282): orientar e instruir a los habitantes en el ejercicio y defensa de sus derechos; divulgar los derechos humanos; <b>invocar el habeas corpus e interponer acciones de tutela<\/b>; <b>organizar y dirigir la defensoría pública<\/b>; <b>interponer acciones populares<\/b>; presentar proyectos de ley sobre su competencia; rendir informes al Congreso."]},{"subtitulo":"4. La Contraloría y el control fiscal (arts. 267–274)","parrafos":["El <b>control fiscal<\/b> es una función pública que ejerce la <b>Contraloría General de la República<\/b>: vigila la <b>gestión fiscal<\/b> de la administración y de los <b>particulares o entidades que manejen fondos o bienes públicos<\/b>. Desde el <b>Acto Legislativo 04 de 2019<\/b>, se ejerce en forma <b>posterior y selectiva<\/b> y, además, puede ser <b>preventivo y concomitante<\/b>, sin que ello implique coadministración. El Contralor es elegido por el <b>Congreso en pleno<\/b> para un periodo de <b>4 años<\/b>, de una lista de elegibles conformada por convocatoria pública.","Le corresponde, entre otras cosas, <b>establecer la responsabilidad fiscal<\/b>, imponer sanciones pecuniarias y ejercer la jurisdicción coactiva sobre los alcances deducidos. En departamentos, distritos y municipios hay contralorías territoriales (art. 272). La vigilancia de la gestión fiscal de la propia Contraloría la ejerce un <b>auditor<\/b> (Auditoría General de la República) elegido para 4 años por el <b>Consejo de Estado<\/b> de terna enviada por la <b>Corte Suprema<\/b> (art. 274).","Resumen de responsabilidades por una misma conducta irregular: <b>disciplinaria<\/b> → Procuraduría (o control interno disciplinario); <b>fiscal<\/b> → Contraloría; <b>penal<\/b> → Fiscalía y jueces. Son independientes entre sí."]}],"conceptos":[{"termino":"Ministerio Público","definicion":"Órgano de control que guarda y promueve los derechos humanos, protege el interés público y vigila la conducta oficial (art. 118)."},{"termino":"Supremo director del Ministerio Público","definicion":"El Procurador General de la Nación (art. 275)."},{"termino":"Poder disciplinario preferente","definicion":"La PGN puede asumir investigaciones disciplinarias que adelanten otras autoridades (control interno disciplinario, personerías) (art. 277-6)."},{"termino":"Funciones directas del Procurador","definicion":"Las del art. 278, que ejerce personalmente (p. ej., desvincular previa audiencia, conceptos de constitucionalidad, nombrar y remover)."},{"termino":"Agente del Ministerio Público","definicion":"Procurador judicial que interviene ante jueces y magistrados con su misma categoría y remuneración (art. 280)."},{"termino":"Defensor del Pueblo","definicion":"Parte del Ministerio Público, bajo la suprema dirección del Procurador; elegido por la Cámara de terna del Presidente."},{"termino":"Control fiscal","definicion":"Vigilancia de la gestión fiscal de quienes manejan recursos públicos; posterior y selectivo, y también preventivo y concomitante."},{"termino":"Responsabilidad fiscal","definicion":"Responsabilidad patrimonial que declara la Contraloría por daño al patrimonio público derivado de la gestión fiscal."},{"termino":"Auditoría General de la República","definicion":"Vigila la gestión fiscal de la Contraloría (art. 274)."}],"confusiones":[{"concepto":"Procurador: elegido por el <b>Senado<\/b>","seConfundeCon":"Defensor: elegido por la <b>Cámara<\/b>; Contralor: por el <b>Congreso en pleno<\/b>","diferencia":"Procurador → Senado (terna Presidente, CSJ, CE). Defensor → Cámara (terna del Presidente). Contralor → Congreso en pleno (lista de elegibles). Todos por 4 años."},{"concepto":"Art. <b>277<\/b> (por sí o por delegados)","seConfundeCon":"Art. <b>278<\/b> (directamente)","diferencia":"El 277 recoge funciones delegables (vigilar, proteger DD. HH., intervenir en procesos). El 278 las personales (desvincular previa audiencia, concepto de constitucionalidad, nombrar y remover)."},{"concepto":"Control <b>disciplinario<\/b> (PGN)","seConfundeCon":"Control <b>fiscal<\/b> (Contraloría)","diferencia":"El disciplinario juzga la conducta del servidor frente a sus deberes. El fiscal establece responsabilidad patrimonial por el manejo de recursos públicos."},{"concepto":"Defensor del Pueblo","seConfundeCon":"Órgano independiente del Ministerio Público","diferencia":"El Defensor forma parte del Ministerio Público y actúa bajo la suprema dirección del Procurador."},{"concepto":"Auditoría General","seConfundeCon":"Contraloría General","diferencia":"La Contraloría vigila a la administración; la Auditoría vigila a la Contraloría."},{"concepto":"Personero municipal","seConfundeCon":"Contralor municipal","diferencia":"El personero integra el Ministerio Público (derechos, interés público, conducta oficial); el contralor ejerce control fiscal."}],"procuraduria":["Esta lección es la base constitucional de tu futuro empleador: la PGN dirige el Ministerio Público y ejerce funciones <b>preventivas, de intervención y disciplinarias<\/b>.","Los cargos convocados en la 252-2026 se ubican en la División de Gestión Humana, en procuradurías regionales/provinciales de instrucción y en la Procuraduría Delegada con Funciones Mixtas 9 para el seguimiento a los recursos del Sistema General de Regalías; los procesos indicados son <b>Talento Humano, Preventivo y Disciplinario<\/b>.","La facultad del art. 284 (pedir información sin que se oponga reserva) explica por qué el técnico debe tramitar con rigor los requerimientos de información que hace la PGN y los que recibe.","El art. 278-6 (nombrar y remover) y el art. 279 (concurso de méritos) son el fundamento del concurso en el que participas."],"altaProbabilidad":["Art. 118: quiénes ejercen el Ministerio Público y sus tres funciones.","Art. 275: supremo director del MP = Procurador.","Art. 276: Senado, 4 años, terna Presidente–Corte Suprema–Consejo de Estado.","Art. 277-6: vigilancia superior de la conducta oficial, incluso de elección popular; poder disciplinario preferente.","Art. 278: funciones directas (desvincular previa audiencia; concepto en constitucionalidad; nombrar y remover).","Art. 281: Defensor elegido por la Cámara, de terna del Presidente, bajo dirección del Procurador.","Contraloría: control fiscal posterior y selectivo + preventivo y concomitante."],"ejemplos":[{"titulo":"Tres responsabilidades, tres órganos","caso":"Un alcalde pagó una obra que nunca se ejecutó.","analisis":"La PGN investiga la falta disciplinaria; la Contraloría establece la responsabilidad fiscal por el detrimento patrimonial; la Fiscalía investiga los posibles delitos. Las tres actuaciones son independientes."},{"titulo":"Poder preferente","caso":"La oficina de control interno disciplinario de un ministerio adelanta una investigación de gran impacto y la PGN decide asumirla.","analisis":"Ejerce el poder disciplinario preferente del art. 277-6; la oficina de control interno pierde la competencia en ese caso."},{"titulo":"Requerimiento de información","caso":"Una procuraduría provincial pide a una alcaldía copia de contratos y la alcaldía responde que son “reservados”.","analisis":"Salvo excepciones legales, no se puede oponer reserva al Procurador (art. 284); además, la PGN puede exigir la información (art. 277-9)."}],"repaso":["MP = Procurador + Defensor + delegados + agentes judiciales + personeros.","Funciones del MP: derechos humanos, interés público, conducta oficial.","Procurador: Senado, 4 años, terna P–CSJ–CE; supremo director del MP.","277 delegables · 278 directas.","Contraloría: control fiscal; Auditoría vigila a la Contraloría."],"preguntas":[{"id":"1.8-01","nivel":1,"tipo":"multiple","enunciado":"Según el artículo 275, el supremo director del Ministerio Público es:","opciones":["El Defensor del Pueblo.","El Procurador General de la Nación.","El Contralor General de la República.","El Fiscal General de la Nación."],"correcta":1,"explicaciones":["El Defensor forma parte del Ministerio Público, pero bajo la dirección del Procurador.","Correcto: art. 275.","El Contralor dirige el control fiscal, no el Ministerio Público.","El Fiscal pertenece a la Rama Judicial."],"concepto":"Procurador: supremo director del Ministerio Público."},{"id":"1.8-02","nivel":1,"tipo":"multiple","enunciado":"El Procurador General de la Nación es elegido:","opciones":["Por la Cámara de Representantes, de terna del Presidente, para 4 años.","Por el Senado, de terna integrada por candidatos del Presidente, la Corte Suprema y el Consejo de Estado, para 4 años.","Por el Congreso en pleno, de lista de elegibles, para 4 años.","Por el Presidente de la República, de terna del Senado, para 4 años."],"correcta":1,"explicaciones":["Así se elige al Defensor del Pueblo.","Correcto: art. 276.","Así se elige al Contralor General.","El Presidente solo postula un candidato a la terna."],"concepto":"Elección del Procurador (art. 276)."},{"id":"1.8-03","nivel":1,"tipo":"multiple","enunciado":"Según el artículo 118, ejercen el Ministerio Público, entre otros:","opciones":["El Procurador, el Defensor del Pueblo y los personeros municipales.","El Procurador, el Contralor y los contralores territoriales.","El Procurador, el Fiscal y los jueces de la República.","El Procurador, el Registrador y los personeros municipales."],"correcta":0,"explicaciones":["Correcto: junto con los procuradores delegados, los agentes ante las autoridades jurisdiccionales y los demás que determine la ley.","Los contralores ejercen control fiscal, no el Ministerio Público.","El Fiscal y los jueces pertenecen a la Rama Judicial.","El Registrador integra la organización electoral."],"concepto":"Integrantes del Ministerio Público (art. 118)."},{"id":"1.8-04","nivel":2,"tipo":"multiple","enunciado":"Llega a la Procuraduría una queja contra un concejal por su conducta en el ejercicio del cargo. Un compañero afirma que la PGN no puede vigilar a servidores de elección popular. Según el artículo 277-6, eso es:","opciones":["Correcto, porque solo el Concejo puede vigilar a sus miembros.","Incorrecto, porque el Procurador ejerce vigilancia superior de la conducta oficial de quienes desempeñen funciones públicas, inclusive las de elección popular.","Correcto, porque los concejales solo responden ante sus electores.","Incorrecto, pero solo si el concejal maneja recursos públicos."],"correcta":1,"explicaciones":["La Constitución no reserva esa vigilancia al Concejo.","Correcto: art. 277-6 (el régimen de sanciones a servidores de elección popular tiene reglas especiales que verás en U8).","La responsabilidad política ante los electores no excluye la vigilancia de la conducta oficial.","La vigilancia no depende del manejo de recursos."],"concepto":"Vigilancia de la conducta oficial, incluida la de elección popular (art. 277-6)."},{"id":"1.8-05","nivel":2,"tipo":"multiple","enunciado":"Sobre el Defensor del Pueblo, es correcto afirmar que:","opciones":["Es un órgano independiente del Ministerio Público, elegido por el Senado.","Forma parte del Ministerio Público, actúa bajo la suprema dirección del Procurador y lo elige la Cámara de terna del Presidente.","Forma parte de la Rama Ejecutiva y lo nombra libremente el Presidente.","Forma parte de la Rama Judicial y lo elige la Corte Constitucional."],"correcta":1,"explicaciones":["Forma parte del Ministerio Público y no lo elige el Senado.","Correcto: art. 281.","No pertenece al Ejecutivo; el Presidente solo elabora la terna.","No pertenece a la Rama Judicial."],"concepto":"Defensor del Pueblo (art. 281)."},{"id":"1.8-06","nivel":2,"tipo":"multiple","enunciado":"Según el artículo 267, la Contraloría General de la República vigila:","opciones":["La conducta disciplinaria de todos los servidores públicos.","La gestión fiscal de la administración y de los particulares o entidades que manejen fondos o bienes públicos.","El cumplimiento de los fallos de tutela.","La legalidad de los procesos electorales."],"correcta":1,"explicaciones":["La conducta disciplinaria la vigila el Ministerio Público.","Correcto: art. 267.","El cumplimiento de la tutela lo verifica el juez.","Los procesos electorales los vigila la organización electoral (y el Ministerio Público en lo de su competencia)."],"concepto":"Objeto del control fiscal (art. 267)."},{"id":"1. function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Texto de contenido: se escapa todo y se re-habilitan etiquetas simples.
function tx(s){ return esc(s).replace(/&lt;(\/?)(b|i|em|strong|u|br)\s*\/?&gt;/g, '<$1$2>').replace(/\[COMPLEMENTARIO\]/g, '<span class="tag-c">[COMPLEMENTARIO]</span>'); }
function barajar(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pad(n){ return (n<10?'0':'')+n; }
function hoyStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function aFecha(s){ var p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

function difDias(a,b){ return Math.round((aFecha(b)-aFecha(a))/86400000); } // b - a
function fechaLarga(s){ if(!s) return ''; try { return aFecha(s).toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return s; } }
function pct(ok,n){ return n ? Math.round(ok*100/n) : 0; }
function clasif(p,n){

  return {t:'Prioridad alta', c:'bad'};
}
