/b>: “Todas las personas tienen derecho a <b>acceder a los documentos públicos<\/b> salvo los casos que establezca la ley. El secreto profesional es inviolable”. Es la base constitucional de la transparencia y del manejo de archivos públicos (desarrollada, entre otras, por la Ley 1712 de 2014)."]},{"subtitulo":"5. Derechos colectivos y del ambiente (arts. 78–82)","parrafos":["<b>Art. 78<\/b>: control de calidad de bienes y servicios y derechos del consumidor. <b>Art. 79<\/b>: todas las personas tienen derecho a gozar de un <b>ambiente sano<\/b>; la ley garantizará la <b>participación de la comunidad en las decisiones que puedan afectarlo<\/b>. <b>Art. 80<\/b>: el Estado planifica el manejo de los recursos naturales para garantizar su desarrollo sostenible. <b>Art. 81<\/b>: se prohíben las armas químicas, biológicas y nucleares. <b>Art. 82<\/b>: el Estado debe velar por la integridad del <b>espacio público<\/b> y su destinación al uso común, el cual <b>prevalece sobre el interés particular<\/b>."]},{"subtitulo":"6. Deberes (art. 95)","parrafos":["El ejercicio de los derechos implica responsabilidades. Son deberes de la persona y del ciudadano: (1) respetar los derechos ajenos y no abusar de los propios; (2) obrar conforme al principio de solidaridad social; (3) respetar y apoyar a las autoridades democráticas legítimamente constituidas; (4) defender y difundir los derechos humanos; (5) participar en la vida política, cívica y comunitaria; (6) propender al logro y mantenimiento de la paz; (7) <b>colaborar para el buen funcionamiento de la administración de justicia<\/b>; (8) proteger los recursos culturales y naturales y velar por un ambiente sano; (9) <b>contribuir al financiamiento de los gastos e inversiones del Estado<\/b> dentro de conceptos de justicia y equidad."]}],"conceptos":[{"termino":"DESC","definicion":"Derechos sociales, económicos y culturales (arts. 42–77). Requieren prestaciones del Estado y se realizan de forma progresiva."},{"termino":"Progresividad y no regresividad","definicion":"Los DESC deben ampliarse gradualmente; un retroceso injustificado en su protección se presume inconstitucional según la jurisprudencia constitucional."},{"termino":"Derechos colectivos","definicion":"Derechos de la comunidad (ambiente sano, espacio público, consumidor). Se protegen con la acción popular."},{"termino":"Primacía de la realidad","definicion":"Principio del art. 53: en una relación laboral prevalece lo que realmente ocurre sobre lo que dicen los papeles."},{"termino":"Favorabilidad laboral (in dubio pro operario)","definicion":"En caso de duda en la aplicación o interpretación de las fuentes formales del derecho, se aplica la situación más favorable al trabajador."},{"termino":"Función social y ecológica de la propiedad","definicion":"La propiedad privada implica obligaciones con la comunidad y con el ambiente (art. 58)."},{"termino":"Servicio público obligatorio (seguridad social)","definicion":"La seguridad social se presta bajo dirección, coordinación y control del Estado, con eficiencia, universalidad y solidaridad, y es irrenunciable (art. 48)."},{"termino":"Acceso a documentos públicos","definicion":"Derecho de toda persona a consultar documentos públicos, salvo las reservas que establezca la ley (art. 74)."}],"confusiones":[{"concepto":"Derecho <b>colectivo<\/b> (ambiente sano)","seConfundeCon":"Derecho <b>fundamental<\/b>","diferencia":"El ambiente sano está en el Cap. 3 (colectivos) y se protege con acción popular; la tutela procede solo si además se afecta un derecho fundamental."},{"concepto":"Seguridad social: <b>eficiencia, universalidad y solidaridad<\/b>","seConfundeCon":"Función administrativa: igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y publicidad","diferencia":"Los tres principios del art. 48 son propios de la seguridad social; los del art. 209 rigen la función administrativa."},{"concepto":"Educación obligatoria de <b>5 a 15 años<\/b>","seConfundeCon":"Mínimo <b>un año de preescolar y nueve de básica<\/b>","diferencia":"Son dos datos distintos del mismo art. 67: la edad y el contenido mínimo."},{"concepto":"Expropiación: <b>sentencia judicial e indemnización previa<\/b>","seConfundeCon":"Confiscación","diferencia":"La expropiación es legítima y se indemniza; la confiscación (quitar bienes sin indemnizar como pena) está prohibida (art. 34)."},{"concepto":"Huelga garantizada","seConfundeCon":"Huelga en servicios públicos esenciales","diferencia":"Art. 56: la huelga no se garantiza en los servicios públicos esenciales definidos por el legislador."},{"concepto":"Art. 74 (acceso a documentos)","seConfundeCon":"Art. 23 (derecho de petición)","diferencia":"El art. 74 consagra el derecho a acceder a documentos públicos; el art. 23 el derecho a pedir y obtener respuesta. Suelen ejercerse juntos."}],"procuraduria":["El art. 277-4 encarga al Procurador <b>defender los intereses colectivos, en especial el ambiente<\/b>: la PGN actúa en defensa del art. 79.","La PGN vigila el cumplimiento de las obligaciones del Estado frente a niños, adolescentes, víctimas, adultos mayores y personas con discapacidad (sujetos de especial protección).","El art. 74 y la Ley 1712 de 2014 son la base del acceso a la información pública; la Procuraduría además vigila el cumplimiento de la ley de transparencia. Para el técnico, implica saber cuándo un documento es público y cuándo tiene reserva legal.","Como empleador, la PGN también debe respetar los principios mínimos del trabajo del art. 53."],"altaProbabilidad":["Art. 44: los derechos de los niños prevalecen sobre los de los demás.","Art. 48: seguridad social obligatoria e irrenunciable; eficiencia, universalidad, solidaridad.","Art. 53: primacía de la realidad, favorabilidad, irrenunciabilidad, convenios OIT.","Art. 58: función social y ecológica; expropiación con sentencia e indemnización previa.","Art. 67: educación obligatoria de 5 a 15 años.","Art. 74: acceso a documentos públicos salvo reserva legal.","Art. 82: el espacio público prevalece sobre el interés particular. Art. 95: deberes."],"ejemplos":[{"titulo":"Primacía de la realidad","caso":"Una persona vinculada por contrato de prestación de servicios cumple horario, recibe órdenes permanentes y tiene puesto fijo durante tres años.","analisis":"Aunque el papel diga “contrato de servicios”, la realidad muestra subordinación: según el art. 53 prevalece la realidad sobre las formas."},{"titulo":"Espacio público","caso":"Un comerciante instala una estructura fija sobre el andén frente a su local.","analisis":"El art. 82 ordena proteger el espacio público y su destinación al uso común, que prevalece sobre el interés particular."},{"titulo":"Acceso a documentos","caso":"Un ciudadano pide copia del contrato de aseo de la sede regional.","analisis":"Es un documento público: debe entregarse (art. 74), salvo que una ley establezca reserva sobre alguna parte."}],"repaso":["Cap. 2 DESC (42–77) · Cap. 3 colectivos (78–82) · Art. 95 deberes.","Niños: sus derechos prevalecen (art. 44).","Seguridad social: obligatoria, irrenunciable; eficiencia, universalidad y solidaridad.","Trabajo (art. 53): realidad > formalidades; en duda, lo más favorable al trabajador.","Documentos públicos: acceso salvo reserva legal (art. 74)."],"preguntas":[{"id":"1.3-01","nivel":1,"tipo":"multiple","enunciado":"Según el artículo 67, la educación será obligatoria:","opciones":["Entre los 5 y los 15 años de edad.","Entre los 3 y los 18 años de edad.","Entre los 6 y los 14 años de edad.","Hasta terminar la educación media."],"correcta":0,"explicaciones":["Correcto: art. 67; comprende como mínimo un año de preescolar y nueve de educación básica.","No corresponde al rango constitucional.","No corresponde al rango constitucional.","La Constitución fija un rango de edad, no la terminación de la media."],"concepto":"Art. 67: educación obligatoria de 5 a 15 años."},{"id":"1.3-02","nivel":1,"tipo":"multiple","enunciado":"De acuerdo con el artículo 44, los derechos de los niños:","opciones":["Tienen el mismo peso que los derechos de los demás.","Prevalecen sobre los derechos de los demás.","Solo pueden ser exigidos por sus padres o representantes legales.","Solo son fundamentales cuando la ley así lo declare."],"correcta":1,"explicaciones":["La Constitución les da prevalencia, no igual peso.","Correcto: texto del art. 44.","Cualquier persona puede exigir a la autoridad competente su cumplimiento.","El art. 44 los declara fundamentales directamente."],"concepto":"Prevalencia de los derechos de los niños (art. 44)."},{"id":"1.3-03","nivel":1,"tipo":"multiple","enunciado":"La seguridad social, según el artículo 48, se presta con sujeción a los principios de:","opciones":["Eficacia, economía y celeridad.","Igualdad, moralidad y publicidad.","Eficiencia, universalidad y solidaridad.","Progresividad, equidad y subsidiariedad."],"correcta":2,"explicaciones":["Son principios de la función administrativa (art. 209).","También son principios de la función administrativa (art. 209).","Correcto: art. 48.","No son los principios que enuncia el art. 48."],"concepto":"Principios de la seguridad social (art. 48)."},{"id":"1.3-04","nivel":2,"tipo":"multiple","enunciado":"Una persona vinculada mediante contrato de prestación de servicios cumple horario fijo, recibe órdenes permanentes y usa los equipos de la entidad durante años. ¿Qué principio del artículo 53 resulta aplicable?","opciones":["Irrenunciabilidad a los beneficios mínimos.","Primacía de la realidad sobre las formalidades.","Estabilidad en el empleo.","Remuneración mínima vital y móvil."],"correcta":1,"explicaciones":["La irrenunciabilidad protege beneficios mínimos ya reconocidos; aquí se discute la naturaleza de la relación.","Correcto: lo que realmente ocurre (subordinación) prevalece sobre lo que dice el contrato.","La estabilidad es otro principio; aquí la discusión es la verdadera naturaleza del vínculo.","No se discute el monto de la remuneración."],"concepto":"Primacía de la realidad (art. 53)."},{"id":"1.3-05","nivel":2,"tipo":"multiple","enunciado":"Un ciudadano pide consultar un documento público que reposa en el archivo de gestión de su dependencia. Según el artículo 74:","opciones":["Solo puede consultarlo si demuestra un interés directo en el asunto.","Tiene derecho a acceder a él, salvo que la ley establezca reserva.","Solo puede consultarlo con autorización del jefe de la dependencia.","Solo puede acceder cuando el documento se transfiera al archivo histórico."],"correcta":1,"explicaciones":["El acceso a documentos públicos no exige demostrar interés.","Correcto: art. 74; la reserva es excepcional y debe estar en la ley.","La autorización discrecional de un jefe no es requisito constitucional.","El derecho se ejerce sobre documentos públicos en cualquier fase del archivo."],"concepto":"Art. 74: acceso a documentos públicos salvo reserva legal."},{"id":"1.3-06","nivel":2,"tipo":"multiple","enunciado":"Un particular ocupa con una construcción permanente una zona verde de uso común. Según el artículo 82:","opciones":["Puede mantenerla si paga un impuesto por el uso.","Puede mantenerla si la construcción tiene más de diez años.","El Estado debe velar por la integridad del espacio público, cuyo uso común prevalece sobre el interés particular.","Solo puede ser retirado si los vecinos presentan una acción de tutela."],"correcta":2,"explicaciones":["El pago no legaliza la ocupación permanente del espacio público.","El paso del tiempo no convierte en privado el espacio público.","Correcto: art. 82.","La protección del espacio público es un deber del Estado; el mecanismo judicial típico es la acción popular, no la tutela."],"concepto":"Espacio público y prevalencia del uso común (art. 82)."},{"id":"1.3-07","nivel":2,"tipo":"multiple","enunciado":"¿Cuál de los siguientes es un deber de la persona y del ciudadano según el artículo 95?","opciones":["Afiliarse a un partido o movimiento político.","Colaborar para el buen funcionamiento de la administración de justicia.","Prestar servicio en la administración pública por un año.","Votar en todas las elecciones bajo pena de sanción."],"correcta":1,"explicaciones":["La afiliación partidista es un derecho (art. 40), no un deber.","Correcto: numeral 7 del art. 95.","No existe ese deber constitucional.","El voto es derecho y deber (art. 258), pero no está sancionado ni es uno de los deberes del art. 95."],"concepto":"Deberes del art. 95."},{"id":"1.3-08","nivel":3,"tipo":"multiple","enunciado":"Sobre la expropiación, el artículo 58 dispone que procede:","opciones":["Por motivos de utilidad pública o interés social definidos por el legislador, mediante sentencia judicial e indemnización previa.","Por decisión del alcalde, sin indemnización, cuando el bien esté abandonado.","Como pena por delitos contra el patrimonio, sin necesidad de indemnización.","Solo por razones de orden público declaradas por el Presidente."],"correcta":0,"explicaciones":["Correcto: es la regla del art. 58 (con vía administrativa solo en los casos que determine la ley y con control judicial posterior).","La expropiación exige indemnización previa y motivos definidos por el legislador.","Quitar bienes como pena sin indemnizar es confiscación, prohibida por el art. 34.","Los motivos son de utilidad pública o interés social definidos por ley, no de orden público."],"concepto":"Expropiación frente a confiscación."},{"id":"1.3-09","nivel":3,"tipo":"multiple","enunciado":"Según el artículo 56, el derecho de huelga:","opciones":["Está garantizado sin excepción alguna.","Está garantizado, salvo en los servicios públicos esenciales definidos por el legislador.","Solo puede ejercerse por trabajadores del sector privado.","Requiere autorización previa del Ministerio del Trabajo en todos los casos."],"correcta":1,"explicaciones":["Tiene una excepción expresa: los servicios públicos esenciales.","Correcto: art. 56.","La Constitución no la limita al sector privado.","La Constitución no exige autorización previa del Ministerio."],"concepto":"Huelga y servicios públicos esenciales (art. 56)."},{"id":"1.3-10","nivel":3,"tipo":"multiple","enunciado":"Una autoridad va a aprobar un proyecto que puede afectar el ambiente de un municipio. Según el artículo 79, la ley debe garantizar:","opciones":["La participación de la comunidad en las decisiones que puedan afectarlo.","La aprobación previa del proyecto por la Procuraduría General de la Nación.","Un referendo municipal obligatorio antes de cualquier decisión.","La autorización del Congreso para cualquier proyecto ambiental."],"correcta":0,"explicaciones":["Correcto: art. 79, inciso primero.","La PGN defiende el ambiente, pero no aprueba previamente los proyectos.","La Constitución no exige referendo; exige participación de la comunidad.","No se requiere autorización del Congreso para cada proyecto."],"concepto":"Ambiente sano y participación comunitaria (art. 79)."},{"id":"1.3-11","nivel":3,"tipo":"multiple","enunciado":"Existen dos normas laborales vigentes que pueden aplicarse a un mismo caso y hay duda sobre cuál usar. Según el artículo 53 debe aplicarse:","opciones":["La norma más reciente, por ser posterior.","La norma de mayor jerarquía, sin importar su contenido.","La situación más favorable al trabajador.","La que elija el empleador, por tener la facultad de dirección."],"correcta":2,"explicaciones":["El criterio cronológico no es el que fija el art. 53 para la duda laboral.","La jerarquía resuelve contradicciones normativas generales, pero el art. 53 fija un criterio especial en caso de duda.","Correcto: principio de favorabilidad en materia laboral.","El empleador no escoge la norma aplicable."],"concepto":"Favorabilidad laboral (art. 53)."},{"id":"1.3-12","nivel":4,"tipo":"multiple","enunciado":"Una comunidad denuncia que una fábrica vierte residuos a un río del que se abastecen cientos de familias. El mecanismo judicial principal para proteger ese derecho es:","opciones":["La acción de tutela, porque el ambiente sano es un derecho fundamental de aplicación inmediata.","La acción popular, porque el ambiente sano es un derecho colectivo.","La acción de cumplimiento, porque toda afectación ambiental viola una ley.","El habeas data, porque se requiere información sobre los vertimientos."],"correcta":1,"explicaciones":["El ambiente sano es colectivo (Cap. 3) y no está en la lista del art. 85; la tutela solo procede si además se afecta un derecho fundamental concreto.","Correcto: art. 88, acciones populares para derechos e intereses colectivos.","La acción de cumplimiento busca que se cumpla una ley o acto administrativo concreto; no es el mecanismo principal para derechos colectivos.","El habeas data protege datos personales, no el ambiente."],"concepto":"Derechos colectivos → acción popular."},{"id":"1.3-13","nivel":4,"tipo":"multiple","enunciado":"Según el artículo 72, el patrimonio arqueológico:","opciones":["Pertenece a quien lo encuentre en su propiedad privada.","Pertenece a la Nación y es inalienable, inembargable e imprescriptible.","Pertenece al municipio donde se encuentre y puede venderse con autorización del concejo.","Pertenece a la Nación, pero puede adquirirse por prescripción adquisitiva."],"correcta":1,"explicaciones":["No pertenece al particular que lo encuentra.","Correcto: art. 72.","Pertenece a la Nación y no puede venderse.","Es imprescriptible: no se adquiere por el paso del tiempo."],"concepto":"Patrimonio arqueológico (art. 72)."},{"id":"1.3-14","nivel":4,"tipo":"multiple","enunciado":"Un servidor recién nombrado pide no ser afiliado al sistema de seguridad social para recibir “más salario neto”. Según el artículo 48:","opciones":["Puede renunciar si lo hace por escrito y ante notario.","Puede renunciar solo a la afiliación en pensiones.","No puede renunciar, porque la seguridad social es un derecho irrenunciable.","Puede renunciar si demuestra que tiene otro seguro privado."],"correcta":2,"explicaciones":["Las formalidades no hacen renunciable un derecho que la Constitución declara irrenunciable.","La irrenunciabilidad aplica a la seguridad social en su conjunto.","Correcto: art. 48 (derecho irrenunciable, servicio público obligatorio).","Un seguro privado no reemplaza la afiliación obligatoria."],"concepto":"Irrenunciabilidad de la seguridad social (art. 48)."},{"id":"1.3-15","nivel":5,"tipo":"multiple","enunciado":"Una norma reduce sin justificación la cobertura de un programa social ya alcanzada. Según la jurisprudencia constitucional sobre los DESC, esa medida:","opciones":["Es válida, porque los DESC son simples aspiraciones sin fuerza jurídica.","Es una medida regresiva que se presume inconstitucional y debe ser justificada.","Es válida siempre que la expida el Congreso mediante ley ordinaria.","Solo puede revisarse mediante acción de cumplimiento."],"correcta":1,"explicaciones":["Los DESC tienen fuerza jurídica; su realización es progresiva, no opcional.","Correcto: principio de progresividad y prohibición de regresividad.","La forma de la norma no elimina el examen sobre su carácter regresivo.","La acción de cumplimiento busca hacer cumplir normas, no controlar su constitucionalidad."],"concepto":"Progresividad y no regresividad de los DESC."},{"id":"1.3-16","nivel":5,"tipo":"multiple","enunciado":"Según el artículo 53, los convenios internacionales del trabajo debidamente ratificados:","opciones":["Solo obligan si una ley posterior los reproduce.","Hacen parte de la legislación interna.","Tienen valor de simple recomendación para los empleadores.","Solo se aplican a trabajadores del sector privado."],"correcta":1,"explicaciones":["No se requiere reproducirlos en una ley posterior.","Correcto: inciso 4 del art. 53.","No son recomendaciones; son normas internas.","La Constitución no restringe su aplicación al sector privado."],"concepto":"Convenios OIT ratificados (art. 53)."}]},{"id":"1.4","titulo":"Mecanismos de protección de los derechos","normas":["Constitución Política: arts. 86–92, 241–242","Decreto 2591 de 1991 (tutela)","Ley 393 de 1997 (acción de cumplimiento)","Ley 472 de 1998 (acciones populares y de grupo)","Ley 1437 de 2011 – CPACA, art. 144","Ley 1581 de 2012 (habeas data)"],"objetivos":["Distinguir la acción de tutela, la acción de cumplimiento, las acciones populares, las acciones de grupo, el habeas corpus y el habeas data por su objeto, titular, requisitos y términos.","Aplicar la regla de subsidiariedad de la tutela y sus excepciones (perjuicio irremediable).","Reconocer el requisito de renuencia de la acción de cumplimiento y el requisito previo de la acción popular.","Conocer el papel del Ministerio Público en estos mecanismos y en el control de constitucionalidad."],"explicacion":[{"subtitulo":"1. La idea central","parrafos":["De nada sirve reconocer derechos si no hay forma de hacerlos valer. El Capítulo 4 del Título II (arts. 83–94) crea <b>acciones judiciales<\/b> para que cualquier persona pueda pedir a un juez que proteja sus derechos. Para el examen, la clave es saber <b>qué protege cada acción<\/b>: derechos fundamentales (tutela), cumplimiento de normas (cumplimiento), derechos colectivos (popular), daños a un grupo (grupo), libertad física (habeas corpus) y datos personales (habeas data)."]},{"subtitulo":"2. Acción de tutela (art. 86 y Decreto 2591 de 1991)","parrafos":["Protege <b>derechos constitucionales fundamentales<\/b> vulnerados o amenazados por la acción u omisión de cualquier autoridad pública (y, en ciertos casos, de particulares). La presenta <b>toda persona<\/b>, en todo momento y lugar, por sí misma o por quien actúe a su nombre (agente oficioso), mediante un procedimiento <b>preferente y sumario<\/b>; no requiere abogado.","<b>Término<\/b>: entre la solicitud y la decisión no pueden pasar más de <b>10 días<\/b>. El fallo es de <b>inmediato cumplimiento<\/b>; puede <b>impugnarse dentro de los 3 días<\/b> siguientes a su notificación y la segunda instancia decide en 20 días. Todos los fallos se envían a la <b>Corte Constitucional para su eventual revisión<\/b>.","<b>Subsidiariedad<\/b>: solo procede cuando no existe otro medio de defensa judicial, <b>salvo que se use como mecanismo transitorio para evitar un perjuicio irremediable<\/b>. Por regla general tampoco procede contra actos de carácter general, impersonal y abstracto, ni para proteger derechos colectivos (salvo que también se afecte un derecho fundamental), ni cuando el daño ya está consumado. No tiene término de caducidad, pero debe presentarse en un plazo razonable (<b>inmediatez<\/b>).","<b>Contra particulares<\/b> procede cuando: prestan un servicio público, su conducta afecta grave y directamente el interés colectivo, o el solicitante está frente a ellos en situación de <b>subordinación o indefensión<\/b>. Quien incumple un fallo de tutela incurre en <b>desacato<\/b> (arresto hasta de 6 meses y multa hasta de 20 salarios mínimos mensuales, sin perjuicio de otras sanciones)."]},{"subtitulo":"3. Acción de cumplimiento (art. 87 y Ley 393 de 1997)","parrafos":["Toda persona puede acudir ante el juez para hacer efectivo el <b>cumplimiento de una ley o de un acto administrativo<\/b>. Requisito clave: <b>constituir en renuencia<\/b> a la autoridad, es decir, reclamarle previamente por escrito el cumplimiento; si no responde en <b>10 días<\/b> o se niega, se puede demandar (salvo inminencia de un perjuicio irremediable).","No procede para proteger derechos que puedan garantizarse por tutela, ni para exigir el cumplimiento de normas que <b>establezcan gastos<\/b>."]},{"subtitulo":"4. Acciones populares y de grupo (art. 88 y Ley 472 de 1998)","parrafos":["<b>Acción popular<\/b>: protege <b>derechos e intereses colectivos<\/b> relacionados con el patrimonio, el espacio, la seguridad y la salubridad públicos, la <b>moral administrativa<\/b>, el ambiente, la libre competencia y otros de similar naturaleza. Busca evitar el daño, hacer cesar la amenaza o restituir las cosas a su estado anterior. Puede presentarla cualquier persona (también el Procurador, el Defensor del Pueblo y los personeros) y se puede promover <b>mientras subsista la amenaza o peligro<\/b>. Antes de demandar, por regla general, se debe pedir a la autoridad o particular que adopte las medidas; si no lo hace en <b>15 días<\/b>, se acude al juez (CPACA, art. 144).","<b>Acción de grupo<\/b> (hoy “reparación de los perjuicios causados a un grupo”): busca la <b>indemnización<\/b> de daños causados a un número plural de personas (mínimo <b>20<\/b>) en condiciones uniformes. Caduca a los <b>2 años<\/b> desde el daño o desde que cesó la acción causante."]},{"subtitulo":"5. Habeas corpus, habeas data y control de constitucionalidad","parrafos":["<b>Habeas corpus<\/b> (art. 30, Ley 1095 de 2006): protege la libertad física frente a privaciones ilegales; ante cualquier juez; se resuelve en 36 horas. <b>Habeas data<\/b> (art. 15, Leyes 1266 de 2008 y 1581 de 2012): permite conocer, actualizar y rectificar datos personales; primero se reclama ante el responsable del dato y, si no se corrige, se puede acudir a la Superintendencia de Industria y Comercio o a la tutela.","<b>Acción pública de inconstitucionalidad<\/b> (arts. 241 y 242): cualquier ciudadano puede demandar ante la Corte Constitucional leyes y decretos con fuerza de ley. El <b>Procurador General debe intervenir en todos los procesos<\/b> rindiendo concepto (30 días) y la Corte decide en 60 días.","<b>Art. 92<\/b>: cualquier persona natural o jurídica puede pedir a la autoridad competente la aplicación de <b>sanciones penales o disciplinarias<\/b> derivadas de la conducta de las autoridades públicas: es el fundamento de la <b>queja disciplinaria<\/b> que recibe la Procuraduría."]}],"conceptos":[{"termino":"Subsidiariedad (tutela)","definicion":"La tutela solo procede si no hay otro medio judicial eficaz, salvo como mecanismo transitorio ante un perjuicio irremediable."},{"termino":"Perjuicio irremediable","definicion":"Daño inminente, grave, que requiere medidas urgentes y que, de consumarse, no podría repararse."},{"termino":"Agente oficioso","definicion":"Persona que presenta la tutela a nombre de otra que no puede hacerlo por sí misma."},{"termino":"Desacato","definicion":"Incumplimiento de una orden de tutela; se sanciona con arresto hasta de 6 meses y multa hasta de 20 SMLMV."},{"termino":"Renuencia","definicion":"Requisito de la acción de cumplimiento: reclamar previamente a la autoridad, que tiene 10 días para responder."},{"termino":"Moral administrativa","definicion":"Derecho colectivo a que la administración actúe con rectitud y buena fe; se protege con acción popular."},{"termino":"Acción de grupo","definicion":"Acción indemnizatoria para un grupo de al menos 20 personas afectadas por una misma causa; caduca en 2 años."},{"termino":"Eventual revisión","definicion":"Los fallos de tutela se envían a la Corte Constitucional, que selecciona discrecionalmente cuáles revisa."},{"termino":"Queja (art. 92)","definicion":"Derecho de cualquier persona a pedir sanciones disciplinarias o penales por la conducta de las autoridades."}],"confusiones":[{"concepto":"Acción de <b>tutela<\/b>","seConfundeCon":"Acción de <b>cumplimiento<\/b>","diferencia":"Tutela: derechos fundamentales. Cumplimiento: que se cumpla una ley o acto administrativo; exige renuencia previa y no procede si cabe la tutela."},{"concepto":"Acción <b>popular<\/b>","seConfundeCon":"Acción de <b>grupo<\/b>","diferencia":"Popular: preventiva/restitutoria de derechos colectivos, sin caducidad mientras subsista la amenaza. Grupo: indemnizatoria, mínimo 20 personas, caduca en 2 años."},{"concepto":"Tutela: <b>10 días<\/b> para fallar","seConfundeCon":"Tutela: <b>3 días<\/b> para impugnar","diferencia":"10 días: plazo del juez para decidir. 3 días: plazo para impugnar el fallo desde su notificación."},{"concepto":"Renuencia: <b>10 días<\/b>","seConfundeCon":"Requisito previo de la acción popular: <b>15 días<\/b>","diferencia":"Cumplimiento: la autoridad tiene 10 días para responder el reclamo. Popular: 15 días para adoptar las medidas pedidas (CPACA, art. 144)."},{"concepto":"Acción pública de inconstitucionalidad","seConfundeCon":"Excepción de inconstitucionalidad","diferencia":"La acción la decide la Corte con efectos generales; la excepción la aplica cualquier autoridad en un caso concreto."},{"concepto":"Habeas corpus","seConfundeCon":"Tutela por libertad","diferencia":"Para una privación ilegal de la libertad el mecanismo idóneo es el habeas corpus (36 horas), no la tutela."}],"procuraduria":["El Procurador, el Defensor del Pueblo y los personeros pueden <b>interponer acciones populares<\/b>, y el art. 277 faculta a la PGN para interponer las acciones que considere necesarias.","El Procurador <b>rinde concepto en todos los procesos de constitucionalidad<\/b> (arts. 242 y 278-5).","Los agentes del Ministerio Público intervienen en procesos judiciales y pueden actuar en trámites de tutela en defensa del orden jurídico y de los derechos fundamentales (art. 277-7).","El art. 92 es la base de las <b>quejas disciplinarias<\/b> que llegan a la PGN; el técnico debe saber recibirlas, radicarlas y remitirlas según el procedimiento.","La Procuraduría, como entidad pública, también puede ser accionada por tutela si vulnera derechos (por ejemplo, por no responder un derecho de petición)."],"altaProbabilidad":["Tutela: derechos fundamentales, 10 días, impugnación en 3 días, eventual revisión de la Corte, subsidiaria salvo perjuicio irremediable.","Tutela contra particulares: servicio público, interés colectivo, subordinación o indefensión.","Cumplimiento: ley o acto administrativo; renuencia (10 días); no para gastos ni si cabe tutela.","Popular: derechos colectivos (incluida la moral administrativa); mientras subsista la amenaza.","Grupo: 20 personas, indemnización, 2 años.","Art. 92: cualquier persona puede pedir sanciones disciplinarias."],"ejemplos":[{"titulo":"Tutela por petición sin respuesta","caso":"Un usuario radicó un derecho de petición hace 30 días hábiles y la entidad no ha respondido.","analisis":"Se vulnera el derecho fundamental de petición (art. 23). No hay otro medio judicial eficaz para obtener la respuesta: procede la tutela."},{"titulo":"Acción de cumplimiento","caso":"Una ley ordena a un municipio publicar un registro y el alcalde no lo hace. Un ciudadano le envía un escrito reclamando el cumplimiento y pasan 10 días sin respuesta.","analisis":"Quedó constituida la renuencia: el ciudadano puede presentar acción de cumplimiento."},{"titulo":"Acción popular por moral administrativa","caso":"Varios vecinos advierten que un contrato público se adjudicó con evidentes irregularidades.","analisis":"La moral administrativa y el patrimonio público son derechos colectivos: procede la acción popular."}],"repaso":["Tutela = fundamentales · Cumplimiento = normas · Popular = colectivos · Grupo = indemnización (20 personas) · Habeas corpus = libertad · Habeas data = datos.","Tutela: 10 días para fallar, 3 para impugnar, revisión eventual.","Cumplimiento: renuencia (10 días). Popular: requisito previo (15 días).","Grupo: caduca en 2 años.","Art. 92: queja disciplinaria."],"preguntas":[{"id":"1.4-01","nivel":1,"tipo":"multiple","enunciado":"Según el artículo 86, entre la solicitud de tutela y su resolución no podrán transcurrir más de:","opciones":["5 días.","10 días.","15 días.","30 días."],"correcta":1,"explicaciones":["5 días no es el término del art. 86.","Correcto: art. 86.","15 días es el término general del derecho de petición, no de la tutela.","No corresponde al término de la tutela."],"concepto":"Tutela: decisión en máximo 10 días."},{"id":"1.4-02","nivel":1,"tipo":"multiple","enunciado":"La acción de cumplimiento (art. 87) tiene por objeto:","opciones":["Proteger los derechos fundamentales amenazados por una autoridad.","Hacer efectivo el cumplimiento de una ley o de un acto administrativo.","Obtener la indemnización de daños causados a un grupo de personas.","Declarar la inconstitucionalidad de una ley."],"correcta":1,"explicaciones":["Eso corresponde a la tutela.","Correcto: art. 87.","Eso corresponde a la acción de grupo.","Eso corresponde a la acción pública de inconstitucionalidad."],"concepto":"Objeto de la acción de cumplimiento."},{"id":"1.4-03","nivel":1,"tipo":"multiple","enunciado":"Las acciones populares del artículo 88 protegen:","opciones":["Los derechos fundamentales de una persona determinada.","Los derechos e intereses colectivos.","La libertad personal frente a capturas ilegales.","El cumplimiento de los contratos estatales."],"correcta":1,"explicaciones":["Los derechos fundamentales individuales se protegen principalmente con tutela.","Correcto: patrimonio, espacio, seguridad y salubridad públicos, moral administrativa, ambiente, libre competencia, entre otros.","La libertad personal se protege con habeas corpus.","Las controversias contractuales tienen su propio medio de control."],"concepto":"Acción popular: derechos colectivos."},{"id":"1.4-04","nivel":2,"tipo":"multiple","enunciado":"Un ciudadano presenta tutela para discutir una decisión que puede controvertir ante la jurisdicción contencioso-administrativa, sin alegar ningún riesgo urgente. Lo más probable es que la tutela sea:","opciones":["Procedente, porque la tutela siempre prevalece sobre los demás medios judiciales.","Improcedente, porque existe otro medio de defensa judicial y no se acreditó un perjuicio irremediable.","Procedente, porque toda persona puede presentar tutela en todo momento.","Improcedente, porque la tutela solo procede contra particulares."],"correcta":1,"explicaciones":["Es al revés: la tutela es subsidiaria.","Correcto: principio de subsidiariedad; la excepción es el perjuicio irremediable.","Que pueda presentarse en todo momento no significa que siempre proceda.","La tutela procede principalmente contra autoridades públicas."],"concepto":"Subsidiariedad de la tutela."},{"id":"1.4-05","nivel":2,"tipo":"multiple","enunciado":"¿En cuál de los siguientes casos procede la tutela contra un particular?","opciones":["Cuando el particular incumple un contrato de compraventa civil.","Cuando el solicitante se encuentra en estado de subordinación o indefensión frente al particular.","Cuando el particular tiene más patrimonio que el solicitante.","Cuando el particular es extranjero."],"correcta":1,"explicaciones":["Un incumplimiento contractual ordinario se discute ante el juez civil.","Correcto: es uno de los tres supuestos del art. 86 (junto con servicio público y afectación grave del interés colectivo).","La diferencia patrimonial por sí sola no hace procedente la tutela.","La nacionalidad del particular es irrelevante."],"concepto":"Tutela contra particulares."},{"id":"1.4-06","nivel":2,"tipo":"multiple","enunciado":"La entidad fue notificada de un fallo de tutela en su contra y no está de acuerdo. ¿Dentro de qué término puede impugnarlo?","opciones":["Dentro de los 3 días siguientes a la notificación.","Dentro de los 5 días siguientes a la notificación.","Dentro de los 10 días siguientes a la notificación.","En cualquier momento, mientras no se haya cumplido."],"correcta":0,"explicaciones":["Correcto: Decreto 2591 de 1991, art. 31. Mientras tanto, el fallo debe cumplirse.","No corresponde al término del Decreto 2591.","10 días es el plazo para fallar la primera instancia.","La impugnación tiene un término preciso; el fallo es de inmediato cumplimiento."],"concepto":"Impugnación de la tutela: 3 días."},{"id":"1.4-07","nivel":2,"tipo":"multiple","enunciado":"Antes de presentar una acción de cumplimiento, por regla general el interesado debe:","opciones":["Presentar una tutela y esperar a que sea negada.","Reclamar por escrito el cumplimiento a la autoridad y esperar su respuesta o el vencimiento de 10 días.","Obtener concepto favorable de la Procuraduría.","Agotar la conciliación extrajudicial ante un notario."],"correcta":1,"explicaciones":["No se exige tutela previa; de hecho, si cabe la tutela, la de cumplimiento no procede.","Correcto: constitución en renuencia (Ley 393 de 1997).","No se exige concepto de la Procuraduría.","La conciliación no es el requisito previo de esta acción."],"concepto":"Renuencia en la acción de cumplimiento."},{"id":"1.4-08","nivel":3,"tipo":"multiple","enunciado":"Treinta personas resultaron afectadas económicamente por la misma falla en la prestación de un servicio y quieren ser indemnizadas en un solo proceso. La acción adecuada y su término de caducidad son:","opciones":["Acción popular; no tiene caducidad mientras subsista la amenaza.","Acción de grupo; 2 años desde el daño o desde que cesó la acción causante.","Acción de tutela; 4 meses desde la vulneración.","Acción de cumplimiento; 1 año desde la renuencia."],"correcta":1,"explicaciones":["La popular protege derechos colectivos, no busca indemnizar a un grupo.","Correcto: Ley 472 de 1998 (mínimo 20 personas, caducidad de 2 años).","La tutela no es indemnizatoria ni tiene un término de caducidad legal.","La de cumplimiento no busca indemnización."],"concepto":"Acción de grupo: indemnización, 20 personas, 2 años."},{"id":"1.4-09","nivel":3,"tipo":"multiple","enunciado":"Un ciudadano llama a la Procuraduría para denunciar que un funcionario municipal le exigió dinero por un trámite. Según el artículo 92 de la Constitución:","opciones":["Solo puede denunciar si es la víctima directa y actúa por medio de abogado.","Cualquier persona puede solicitar a la autoridad competente las sanciones penales o disciplinarias derivadas de la conducta de las autoridades.","Solo los servidores públicos pueden solicitar sanciones disciplinarias.","Debe acudir primero ante el alcalde antes de acudir a la Procuraduría."],"correcta":1,"explicaciones":["No se exige ser víctima directa ni actuar por abogado.","Correcto: art. 92, fundamento de la queja disciplinaria.","El art. 92 habla de cualquier persona natural o jurídica.","No hay requisito de acudir previamente al alcalde."],"concepto":"Art. 92: queja disciplinaria."},{"id":"1.4-10","nivel":3,"tipo":"multiple","enunciado":"Un ciudadano presenta acción de cumplimiento para que se ejecute una norma que ordena construir un hospital con cargo al presupuesto. La acción es:","opciones":["Procedente, porque toda ley es exigible mediante esta acción.","Improcedente, porque no puede perseguirse el cumplimiento de normas que establezcan gastos.","Procedente, si el ciudadano demuestra que vive en el municipio.","Improcedente, porque la acción de cumplimiento solo procede frente a actos administrativos."],"correcta":1,"explicaciones":["Tiene límites: no procede para normas que establezcan gastos ni cuando cabe la tutela.","Correcto: parágrafo del art. 9 de la Ley 393 de 1997.","El domicilio no subsana la improcedencia.","Procede frente a leyes y actos administrativos (art. 87)."],"concepto":"Improcedencia de la acción de cumplimiento: normas que establecen gastos."},{"id":"1.4-11","nivel":3,"tipo":"multiple","enunciado":"¿Hasta cuándo puede promoverse una acción popular según la Ley 472 de 1998?","opciones":["Dentro de los 2 años siguientes a la ocurrencia del daño.","Durante el tiempo que subsista la amenaza o peligro al derecho colectivo.","Dentro de los 4 meses siguientes a la vulneración.","Dentro de los 30 días siguientes a la respuesta de la autoridad."],"correcta":1,"explicaciones":["2 años es la caducidad de la acción de grupo.","Correcto: art. 11 de la Ley 472 de 1998.","No es el término de la acción popular.","No existe ese término para la acción popular."],"concepto":"Acción popular: mientras subsista la amenaza."},{"id":"1.4-12","nivel":4,"tipo":"multiple","enunciado":"Un grupo de servidores presenta tutela contra un decreto de carácter general, impersonal y abstracto que reglamenta horarios en todo el sector público. La tutela es, por regla general:","opciones":["Procedente, porque toda norma puede afectar derechos fundamentales.","Improcedente, porque la tutela no procede contra actos de carácter general, impersonal y abstracto.","Procedente, si la presenta un sindicato.","Improcedente, porque los servidores públicos no pueden presentar tutela."],"correcta":1,"explicaciones":["La posible afectación no cambia la regla general de improcedencia contra estos actos.","Correcto: art. 6 del Decreto 2591 de 1991; esos actos se controlan con los medios de nulidad.","Quién la presenta no cambia la naturaleza del acto atacado.","Los servidores públicos sí pueden presentar tutela."],"concepto":"Tutela improcedente contra actos generales, impersonales y abstractos."},{"id":"1.4-13","nivel":4,"tipo":"multiple","enunciado":"En un proceso de constitucionalidad ante la Corte Constitucional, el Procurador General de la Nación:","opciones":["Interviene solo si la Corte lo invita.","Debe intervenir en todos los procesos rindiendo concepto.","Decide el proceso cuando la Corte no lo hace en el término legal.","Interviene solo cuando la ley demandada se refiere al Ministerio Público."],"correcta":1,"explicaciones":["Su intervención es obligatoria, no por invitación.","Correcto: arts. 242-2 y 278-5 de la Constitución (30 días para el concepto).","El Procurador no decide; la decisión es de la Corte.","Interviene en todos los procesos, sin importar la materia."],"concepto":"Concepto del Procurador en los procesos de constitucionalidad."},{"id":"1.4-14","nivel":4,"tipo":"multiple","enunciado":"Una usuaria descubre que una base de datos registra información personal errada sobre ella. ¿Qué derecho la ampara y cuál es el primer paso?","opciones":["Habeas corpus; acudir de inmediato ante un juez penal.","Habeas data; reclamar la rectificación ante el responsable del dato.","Derecho de petición; presentar una acción popular.","Habeas data; presentar directamente acción de grupo."],"correcta":1,"explicaciones":["El habeas corpus protege la libertad física.","Correcto: art. 15 (conocer, actualizar y rectificar); primero se reclama al responsable y, si no corrige, se acude a la SIC o a la tutela.","La acción popular protege derechos colectivos, no datos personales.","La acción de grupo es indemnizatoria y requiere un grupo de al menos 20 personas."],"concepto":"Habeas data: conocer, actualizar y rectificar."},{"id":"1.4-15","nivel":5,"tipo":"multiple","enunciado":"Un servidor incumple deliberadamente una orden de tutela ya ejecutoriada. Según el Decreto 2591 de 1991, incurre en desacato, sancionable con:","opciones":["Amonestación escrita y anotación en la hoja de vida.","Arresto hasta de 6 meses y multa hasta de 20 salarios mínimos mensuales, sin perjuicio de otras sanciones.","Destitución inmediata ordenada por el juez de tutela.","Multa de 100 salarios mínimos sin posibilidad de arresto."],"correcta":1,"explicaciones":["No es la sanción por desacato.","Correcto: art. 52 del Decreto 2591 de 1991; además puede haber responsabilidad penal y disciplinaria.","El juez de tutela no destituye; la responsabilidad disciplinaria se adelanta por separado.","No corresponde a la sanción prevista."],"concepto":"Desacato en tutela."},{"id":"1.4-16","nivel":5,"tipo":"multiple","enunciado":"Antes de demandar en acción popular a una entidad por la invasión de un parque, y sin que haya perjuicio irremediable, el ciudadano debe:","opciones":["Constituir en renuencia a la entidad, que tiene 10 días para responder.","Pedir a la entidad que adopte las medidas para proteger el derecho; si no lo hace en 15 días, acudir al juez.","Presentar una tutela y esperar el fallo de segunda instancia.","Esperar 2 años para verificar si la invasión se consolida."],"correcta":1,"explicaciones":["La renuencia con 10 días es el requisito de la acción de cumplimiento.","Correcto: requisito previo de la acción popular (CPACA, art. 144).","No se exige tutela previa.","No existe esa espera; además, la acción procede mientras subsista la amenaza."],"concepto":"Requisito previo de la acción popular: 15 días."}]},{"id":"1.5","titulo":"Participación democrática y mecanismos de participación ciudadana","normas":["Constitución Política: arts. 40, 98–99, 103–104, 155, 258–259, 270, 378","Ley 134 de 1994","Ley Estatutaria 1757 de 2015","Ley 850 de 2003 (veedurías ciudadanas)"],"objetivos":["Enumerar los siete mecanismos de participación del art. 103 y definir cada uno.","Diferenciar plebiscito, referendo y consulta popular, y saber quién convoca cada uno.","Identificar los derechos políticos del art. 40 y los requisitos de la ciudadanía.","Relacionar el control social (veedurías, rendición de cuentas) con la vigilancia de la gestión pública."],"explicacion":[{"subtitulo":"1. Democracia representativa y participativa","parrafos":["En la democracia <b>representativa<\/b> el pueblo elige a quienes deciden por él (Congreso, Presidente, gobernadores, alcaldes, concejos). La Constitución de 1991 agregó la democracia <b>participativa<\/b>: el pueblo también decide directamente y controla a sus gobernantes. Por eso el art. 1 dice que Colombia es una república “democrática, participativa y pluralista” y el art. 3 permite ejercer la soberanía “en forma directa”."]},{"subtitulo":"2. Los siete mecanismos del artículo 103","parrafos":["Truco para memorizarlos: <b>“Vo-Ple-Re-Con-Ca-I-Re”<\/b> → <b>Vo<\/b>to, <b>Ple<\/b>biscito, <b>Re<\/b>ferendo, <b>Con<\/b>sulta popular, <b>Ca<\/b>bildo abierto, <b>I<\/b>niciativa legislativa y <b>Re<\/b>vocatoria del mandato. [COMPLEMENTARIO] La tutela, la acción popular o el derecho de petición <b>no<\/b> son mecanismos de participación del art. 103 (son mecanismos de protección o derechos).","<b>Plebiscito<\/b>: pronunciamiento del pueblo, <b>convocado por el Presidente<\/b>, mediante el cual <b>apoya o rechaza una decisión del Ejecutivo<\/b>.","<b>Referendo<\/b>: convocatoria al pueblo para que <b>apruebe o rechace un proyecto de norma jurídica<\/b> o <b>derogue o no una norma vigente<\/b> (referendo aprobatorio o derogatorio). También es una de las vías de reforma constitucional (arts. 374 y 378).","<b>Consulta popular<\/b>: una <b>pregunta de carácter general<\/b> sobre un asunto de trascendencia nacional, departamental, municipal o local, que somete el <b>Presidente, el gobernador o el alcalde<\/b>, según el caso; la decisión del pueblo es <b>obligatoria<\/b>. La consulta nacional requiere la firma de todos los ministros y el <b>concepto previo favorable del Senado<\/b> (art. 104).","<b>Cabildo abierto<\/b>: <b>reunión pública de los concejos o de las juntas administradoras locales<\/b> en la que los habitantes participan directamente para discutir asuntos de interés de la comunidad.","<b>Iniciativa popular legislativa y normativa<\/b>: derecho de un grupo de ciudadanos a presentar proyectos de acto legislativo y de ley ante el Congreso, de ordenanza ante las asambleas, de acuerdo ante los concejos o de resolución ante las JAL. Ante el Congreso se requiere un número de ciudadanos igual o superior al <b>5 % del censo electoral<\/b>, o el 30 % de los concejales o diputados del país (art. 155).","<b>Revocatoria del mandato<\/b>: derecho de los ciudadanos a dar por terminado el mandato conferido a un <b>gobernador o alcalde<\/b>. Se basa en el <b>voto programático<\/b> (art. 259): quien vota por ellos les impone como mandato el programa que inscribieron."]},{"subtitulo":"3. Derechos políticos y ciudadanía","parrafos":["<b>Art. 40<\/b>: todo ciudadano tiene derecho a participar en la conformación, ejercicio y control del poder político: elegir y ser elegido; tomar parte en elecciones, plebiscitos, referendos y consultas; constituir partidos; revocar el mandato; tener iniciativa en las corporaciones públicas; <b>interponer acciones públicas en defensa de la Constitución y de la ley<\/b>; y <b>acceder al desempeño de funciones y cargos públicos<\/b> (base constitucional de tu concurso). Las autoridades garantizarán la participación adecuada y efectiva de la mujer en los niveles decisorios.","<b>Ciudadanía<\/b> (arts. 98 y 99): se ejerce desde los <b>18 años<\/b>; ser ciudadano en ejercicio es condición previa para votar, ser elegido y desempeñar cargos públicos que lleven anexa autoridad o jurisdicción. La ciudadanía se pierde de hecho al renunciar a la nacionalidad y su ejercicio puede suspenderse por decisión judicial.","<b>Art. 258<\/b>: el voto es un <b>derecho y un deber ciudadano<\/b> y es secreto."]},{"subtitulo":"4. Control social a la gestión pública","parrafos":["<b>Art. 270<\/b>: la ley organizará las formas y sistemas de participación ciudadana que permitan <b>vigilar la gestión pública<\/b> y sus resultados. Así nacen las <b>veedurías ciudadanas<\/b> (Ley 850 de 2003): mecanismos democráticos de representación que permiten a los ciudadanos u organizaciones ejercer vigilancia sobre la gestión pública.","La <b>Ley Estatutaria 1757 de 2015<\/b> regula la participación democrática, el <b>control social<\/b> y la <b>rendición de cuentas<\/b>: proceso mediante el cual los servidores y entidades del Estado <b>informan, dialogan y responden<\/b> a la ciudadanía sobre su gestión."]}],"conceptos":[{"termino":"Plebiscito","definicion":"El pueblo, convocado por el Presidente, apoya o rechaza una decisión del Ejecutivo."},{"termino":"Referendo","definicion":"El pueblo aprueba o rechaza un proyecto de norma jurídica, o deroga o no una norma vigente."},{"termino":"Consulta popular","definicion":"Pregunta general sobre un asunto de trascendencia, sometida por el Presidente, gobernador o alcalde; la decisión es obligatoria."},{"termino":"Cabildo abierto","definicion":"Reunión pública de concejos o JAL en la que los habitantes discuten asuntos de interés comunitario."},{"termino":"Iniciativa popular","definicion":"Derecho de un grupo de ciudadanos de presentar proyectos normativos ante corporaciones públicas."},{"termino":"Revocatoria del mandato","definicion":"Los ciudadanos dan por terminado el mandato de un gobernador o alcalde."},{"termino":"Voto programático","definicion":"Quien elige gobernador o alcalde le impone por mandato el programa inscrito (art. 259)."},{"termino":"Veeduría ciudadana","definicion":"Mecanismo de control social para vigilar la gestión pública (Ley 850 de 2003)."},{"termino":"Rendición de cuentas","definicion":"Proceso en el que las entidades informan, dialogan y responden a la ciudadanía por su gestión (Ley 1757 de 2015)."}],"confusiones":[{"concepto":"<b>Plebiscito<\/b>","seConfundeCon":"<b>Referendo<\/b>","diferencia":"Plebiscito: apoyar o rechazar una <b>decisión del Ejecutivo<\/b>. Referendo: aprobar o rechazar una <b>norma<\/b> (o derogarla)."},{"concepto":"<b>Plebiscito<\/b>","seConfundeCon":"<b>Consulta popular<\/b>","diferencia":"El plebiscito lo convoca solo el Presidente sobre decisiones del Ejecutivo; la consulta es una pregunta general y la pueden convocar Presidente, gobernador o alcalde."},{"concepto":"<b>Cabildo abierto<\/b>","seConfundeCon":"<b>Consulta popular<\/b>","diferencia":"El cabildo es una reunión deliberativa en el concejo o JAL; no hay votación del pueblo con efecto obligatorio."},{"concepto":"Revocatoria del mandato","seConfundeCon":"Revocatoria de congresistas o del Presidente","diferencia":"Solo procede contra <b>gobernadores y alcaldes<\/b>."},{"concepto":"Mecanismos de <b>participación<\/b> (art. 103)","seConfundeCon":"Mecanismos de <b>protección<\/b> (arts. 86–88)","diferencia":"Tutela, cumplimiento y acciones populares protegen derechos; no están en la lista del art. 103."},{"concepto":"Iniciativa popular: <b>5 % del censo<\/b>","seConfundeCon":"<b>30 % de concejales o diputados<\/b>","diferencia":"Son dos vías alternativas del art. 155 para presentar proyectos de ley."}],"procuraduria":["La función <b>preventiva<\/b> de la Procuraduría promueve la participación ciudadana y vigila que las entidades cumplan sus deberes de rendición de cuentas y transparencia.","La PGN defiende los intereses de la sociedad (art. 277-3) y vigila la conducta de los servidores, incluidos los de elección popular, en relación con los procesos electorales y de participación.","Los personeros municipales, que integran el Ministerio Público, apoyan a las veedurías ciudadanas y orientan a la comunidad sobre estos mecanismos.","Como técnico, una de tus funciones es <b>orientar a los usuarios internos y externos<\/b> (función 7 del cargo): debes saber explicar a un ciudadano qué mecanismo le sirve y a quién acudir."],"altaProbabilidad":["Lista del art. 103 (siete mecanismos): voto, plebiscito, referendo, consulta popular, cabildo abierto, iniciativa legislativa, revocatoria del mandato.","Plebiscito = decisión del Ejecutivo (Presidente). Referendo = norma.","Consulta popular nacional: firma de todos los ministros y concepto favorable del Senado; decisión obligatoria.","Revocatoria: solo gobernadores y alcaldes (voto programático).","Cabildo abierto: concejos y JAL.","Art. 40: acceder a cargos públicos e interponer acciones públicas. Art. 270: control ciudadano a la gestión pública."],"ejemplos":[{"titulo":"¿Plebiscito o referendo?","caso":"El Presidente convoca al pueblo para que respalde o no un acuerdo que firmó el Gobierno.","analisis":"Es un <b>plebiscito<\/b>: se apoya o rechaza una decisión del Ejecutivo, no se aprueba una norma."},{"titulo":"Cabildo abierto","caso":"Los vecinos de una localidad piden discutir en sesión pública de la JAL el cierre de un parque.","analisis":"Es un <b>cabildo abierto<\/b>: reunión pública de la JAL con participación directa de los habitantes."},{"titulo":"Orientación al usuario","caso":"Un ciudadano quiere “quitarle el cargo” al alcalde porque no cumple su programa.","analisis":"El mecanismo es la <b>revocatoria del mandato<\/b>, que procede contra alcaldes y gobernadores con base en el voto programático; no es una queja disciplinaria."}],"repaso":["Art. 103: Vo-Ple-Re-Con-Ca-I-Re.","Plebiscito → Ejecutivo · Referendo → norma · Consulta → pregunta general obligatoria.","Revocatoria → gobernadores y alcaldes.","Ciudadanía: 18 años. Voto: derecho y deber.","Control social: veedurías (Ley 850/2003) y rendición de cuentas (Ley 1757/2015)."],"preguntas":[{"id":"1.5-01","nivel":1,"tipo":"multiple","enunciado":"¿Cuál de las siguientes figuras NO es un mecanismo de participación del pueblo según el artículo 103?","opciones":["El cabildo abierto.","La revocatoria del mandato.","La acción de tutela.","La consulta popular."],"correcta":2,"explicaciones":["El cabildo abierto sí está en el art. 103.","La revocatoria del mandato sí está en el art. 103.","Correcto: la tutela es un mecanismo de protección de derechos fundamentales (art. 86), no de participación.","La consulta popular sí está en el art. 103."],"concepto":"Lista de mecanismos de participación del art. 103."},{"id":"1.5-02","nivel":1,"tipo":"multiple","enunciado":"La revocatoria del mandato procede contra:","opciones":["Congresistas y diputados.","Gobernadores y alcaldes.","El Presidente y los ministros.","Concejales y ediles."],"correcta":1,"explicaciones":["No procede contra miembros de corporaciones públicas.","Correcto: gobernadores y alcaldes, con base en el voto programático.","No procede contra el Presidente ni los ministros.","No procede contra concejales ni ediles."],"concepto":"Revocatoria del mandato: gobernadores y alcaldes."},{"id":"1.5-03","nivel":1,"tipo":"multiple","enunciado":"El plebiscito es el pronunciamiento del pueblo, convocado por:","opciones":["El Congreso, para aprobar o rechazar un proyecto de ley.","El Presidente de la República, para apoyar o rechazar una decisión del Ejecutivo.","Los alcaldes, para resolver asuntos de trascendencia municipal.","La Registraduría, para elegir a los miembros de las corporaciones públicas."],"correcta":1,"explicaciones":["Aprobar o rechazar un proyecto de norma es propio del referendo.","Correcto: definición de la Ley 134 de 1994.","Eso corresponde a la consulta popular municipal.","La Registraduría organiza elecciones; no convoca plebiscitos."],"concepto":"Plebiscito: Presidente, decisión del Ejecutivo."},{"id":"1.5-04","nivel":2,"tipo":"multiple","enunciado":"Un grupo de ciudadanos promueve que el pueblo decida si se deroga o no una norma vigente. Se trata de:","opciones":["Un plebiscito.","Una consulta popular.","Un referendo.","Un cabildo abierto."],"correcta":2,"explicaciones":["El plebiscito versa sobre decisiones del Ejecutivo, no sobre la derogatoria de normas.","La consulta es una pregunta general sobre un asunto de trascendencia, no la derogatoria de una norma.","Correcto: referendo derogatorio.","El cabildo es una reunión deliberativa; no deroga normas."],"concepto":"Referendo aprobatorio y derogatorio."},{"id":"1.5-05","nivel":2,"tipo":"multiple","enunciado":"La reunión pública de un concejo municipal en la que los habitantes participan directamente para discutir asuntos de interés de la comunidad se denomina:","opciones":["Consulta popular.","Cabildo abierto.","Audiencia de rendición de cuentas.","Iniciativa normativa."],"correcta":1,"explicaciones":["La consulta es una votación sobre una pregunta general.","Correcto: cabildo abierto (concejos y JAL).","La rendición de cuentas la hacen las entidades sobre su gestión; no es el mecanismo del art. 103 descrito.","La iniciativa es la presentación de proyectos normativos."],"concepto":"Cabildo abierto."},{"id":"1.5-06","nivel":2,"tipo":"multiple","enunciado":"Para convocar una consulta popular nacional, el Presidente necesita, según el artículo 104:","opciones":["La firma de todos los ministros y el concepto previo favorable del Senado.","La aprobación de la Corte Constitucional y del Consejo de Estado.","La firma del Procurador General y del Registrador Nacional.","Una ley aprobada por mayoría absoluta en ambas cámaras."],"correcta":0,"explicaciones":["Correcto: art. 104.","No se exige aprobación de las altas cortes para convocarla.","No intervienen el Procurador ni el Registrador en la convocatoria.","Se exige concepto del Senado, no una ley de ambas cámaras."],"concepto":"Consulta popular nacional (art. 104)."},{"id":"1.5-07","nivel":2,"tipo":"multiple","enunciado":"Según el artículo 155, para presentar un proyecto de ley por iniciativa popular se requiere un número de ciudadanos igual o superior al:","opciones":["1 % del censo electoral.","5 % del censo electoral.","10 % del censo electoral.","30 % del censo electoral."],"correcta":1,"explicaciones":["No corresponde al porcentaje constitucional.","Correcto: 5 % del censo electoral (alternativamente, 30 % de concejales o diputados del país).","No corresponde al porcentaje constitucional.","El 30 % se refiere a concejales o diputados, no al censo electoral."],"concepto":"Iniciativa popular legislativa (art. 155)."},{"id":"1.5-08","nivel":3,"tipo":"multiple","enunciado":"¿En qué figura constitucional se fundamenta la revocatoria del mandato?","opciones":["En la responsabilidad disciplinaria de los servidores públicos.","En el voto programático, por el cual el elector impone al elegido el programa inscrito.","En el control político que ejerce el Congreso.","En el control fiscal que ejerce la Contraloría."],"correcta":1,"explicaciones":["La responsabilidad disciplinaria la investiga la Procuraduría; es distinta de la revocatoria.","Correcto: art. 259.","El control político del Congreso recae sobre el Gobierno nacional (moción de censura), no sobre alcaldes.","El control fiscal vigila el manejo de recursos públicos."],"concepto":"Voto programático (art. 259)."},{"id":"1.5-09","nivel":3,"tipo":"multiple","enunciado":"Un grupo de ciudadanos se organiza para vigilar la ejecución de un contrato de obra pública en su barrio. Está ejerciendo:","opciones":["Control fiscal, propio de la Contraloría.","Control social por medio de una veeduría ciudadana.","Control disciplinario, propio de la Procuraduría.","Control político, propio de los concejos."],"correcta":1,"explicaciones":["Los ciudadanos no ejercen control fiscal; pueden informar a la Contraloría.","Correcto: art. 270 y Ley 850 de 2003.","Los ciudadanos pueden presentar quejas, pero el control disciplinario lo ejercen las autoridades competentes.","El control político lo ejercen las corporaciones públicas."],"concepto":"Veedurías ciudadanas y control social."},{"id":"1.5-10","nivel":3,"tipo":"multiple","enunciado":"Según los artículos 98 y 99, la calidad de ciudadano en ejercicio:","opciones":["Se adquiere a los 16 años y permite votar en elecciones locales.","Se ejerce desde los 18 años y es condición previa para elegir, ser elegido y desempeñar cargos con autoridad o jurisdicción.","Se adquiere con la expedición del pasaporte.","Solo se exige para desempeñar cargos de elección popular."],"correcta":1,"explicaciones":["La ciudadanía se ejerce desde los 18 años.","Correcto: arts. 98 y 99.","No depende del pasaporte.","También se exige para votar y para cargos con autoridad o jurisdicción."],"concepto":"Ciudadanía (arts. 98–99)."},{"id":"1.5-11","nivel":3,"tipo":"multiple","enunciado":"De acuerdo con el artículo 258, el voto es:","opciones":["Un derecho y un deber ciudadano.","Un derecho exclusivamente, sin carácter de deber.","Una obligación legal sancionable con multa.","Un privilegio de quienes están inscritos en partidos."],"correcta":0,"explicaciones":["Correcto: art. 258.","La Constitución lo define también como deber.","No se sanciona con multa a quien no vota.","Todos los ciudadanos pueden votar, sin necesidad de afiliación."],"concepto":"El voto: derecho y deber (art. 258)."},{"id":"1.5-12","nivel":4,"tipo":"multiple","enunciado":"El alcalde de un municipio quiere que la población decida, con efecto obligatorio, si está de acuerdo con que se adelante un proyecto minero en su territorio. El mecanismo adecuado es:","opciones":["Plebiscito.","Referendo.","Consulta popular.","Cabildo abierto."],"correcta":2,"explicaciones":["El plebiscito solo lo convoca el Presidente.","No se trata de aprobar ni derogar una norma jurídica.","Correcto: pregunta de carácter general sobre un asunto de trascendencia municipal, sometida por el alcalde.","El cabildo es deliberativo y no tiene efecto obligatorio."],"concepto":"Consulta popular municipal."},{"id":"1.5-13","nivel":4,"tipo":"multiple","enunciado":"La rendición de cuentas regulada en la Ley 1757 de 2015 se entiende como:","opciones":["La presentación anual de estados financieros ante la Contaduría.","El proceso mediante el cual servidores y entidades informan, dialogan y responden a la ciudadanía sobre su gestión.","La obligación de los ciudadanos de justificar el uso de subsidios.","La sanción que impone el Congreso a los ministros mediante moción de censura."],"correcta":1,"explicaciones":["Eso es reporte contable, no rendición de cuentas a la ciudadanía.","Correcto: definición de la Ley 1757 de 2015.","La rendición de cuentas es un deber de las entidades, no de los ciudadanos.","La moción de censura es control político del Congreso."],"concepto":"Rendición de cuentas (Ley 1757 de 2015)."},{"id":"1.5-14","nivel":4,"tipo":"multiple","enunciado":"Un usuario pregunta si el resultado de una consulta popular válidamente realizada obliga a la autoridad. La respuesta correcta es:","opciones":["No, porque la consulta solo tiene valor de recomendación.","Sí, la decisión del pueblo es obligatoria.","Solo si el Congreso la ratifica mediante ley.","Solo si la Corte Constitucional la declara exequible."],"correcta":1,"explicaciones":["La consulta no es una simple recomendación.","Correcto: art. 104 y Ley 134 de 1994: la decisión del pueblo es obligatoria.","No se requiere ratificación del Congreso.","La obligatoriedad no depende de un fallo posterior de la Corte."],"concepto":"Obligatoriedad de la consulta popular."},{"id":"1.5-15","nivel":5,"tipo":"multiple","enunciado":"Según el artículo 378, un referendo constitucional se entiende aprobado cuando:","opciones":["Lo vota afirmativamente la mayoría simple de los sufragantes, sin importar la participación.","Obtiene el voto afirmativo de más de la mitad de los sufragantes y el número de estos excede la cuarta parte del censo electoral.","Obtiene el voto afirmativo de las dos terceras partes del censo electoral.","Es aprobado por la Corte Constitucional después de la votación."],"correcta":1,"explicaciones":["La Constitución exige además un umbral de participación.","Correcto: art. 378.","No corresponde al umbral constitucional.","La Corte controla, pero la aprobación la da el pueblo."],"concepto":"Referendo constitucional (art. 378)."},{"id":"1.5-16","nivel":5,"tipo":"multiple","enunciado":"¿Cuál de los siguientes derechos hace parte del artículo 40 de la Constitución?","opciones":["Recibir un subsidio por ejercer el voto.","Interponer acciones públicas en defensa de la Constitución y de la ley.","Ser nombrado en un cargo público sin concurso cuando se tiene experiencia.","Exigir la reelección indefinida de autoridades locales."],"correcta":1,"explicaciones":["No existe ese derecho.","Correcto: numeral 6 del art. 40.","El art. 40 consagra el derecho a acceder a cargos públicos, pero los de carrera se proveen por concurso de méritos (art. 125).","No existe ese derecho."],"concepto":"Derechos políticos del art. 40."}]},{"id":"1.6","titulo":"Estructura del Estado: ramas del poder, órganos autónomos y organización territorial","normas":["Constitución Política: arts. 113–121","Arts. 114, 132, 150–152 (Rama Legislativa)","Arts. 115, 188–197 (Rama Ejecutiva)","Art. 116 (Rama Judicial)","Arts. 212–215 (estados de excepción)","Arts. 286–287, 311 (organización territorial)"],"objetivos":["Describir la estructura del Estado del art. 113: tres ramas, órganos autónomos e independientes y colaboración armónica.","Identificar las funciones y la composición de las ramas legislativa, ejecutiva y judicial.","Ubicar los órganos de control y la organización electoral.","Reconocer las clases de leyes, los estados de excepción y las entidades territoriales."],"explicacion":[{"subtitulo":"1. El mapa general (art. 113)","parrafos":["El poder público se divide en <b>tres ramas<\/b>: <b>legislativa<\/b> (hace las leyes), <b>ejecutiva<\/b> (gobierna y administra) y <b>judicial<\/b> (administra justicia). Además existen <b>órganos autónomos e independientes<\/b> para cumplir las demás funciones del Estado: los <b>órganos de control<\/b> (Ministerio Público y Contraloría, art. 117), la <b>organización electoral<\/b> (Consejo Nacional Electoral y Registraduría Nacional del Estado Civil, art. 120), el Banco de la República, la Comisión Nacional del Servicio Civil, entre otros.","Los órganos tienen funciones separadas, pero <b>colaboran armónicamente<\/b> para realizar los fines del Estado. Y una regla de oro para todo servidor (art. 121): <b>ninguna autoridad puede ejercer funciones distintas de las que le atribuyen la Constitución y la ley<\/b>."]},{"subtitulo":"2. Rama Legislativa","parrafos":["El <b>Congreso<\/b> está integrado por el <b>Senado<\/b> y la <b>Cámara de Representantes<\/b> (Congreso bicameral) y sus miembros se eligen para <b>4 años<\/b>. Según el art. 114, le corresponde <b>reformar la Constitución, hacer las leyes y ejercer control político<\/b> sobre el Gobierno y la administración (por ejemplo, citaciones y moción de censura a ministros).","Clases de leyes más preguntadas: <b>ordinarias<\/b>; <b>orgánicas<\/b> (reglamento del Congreso, presupuesto, ordenamiento territorial); <b>estatutarias<\/b> (art. 152: derechos fundamentales y sus mecanismos de protección, administración de justicia, partidos, <b>mecanismos de participación ciudadana<\/b>, estados de excepción, igualdad electoral), que exigen <b>mayoría absoluta<\/b>, aprobación en <b>una sola legislatura<\/b> y <b>revisión previa<\/b> de la Corte Constitucional; y <b>leyes marco<\/b> (art. 150-19). Ejemplos de leyes estatutarias: Ley 1755 de 2015 (petición), Ley 1757 de 2015 (participación), Ley 1581 de 2012 (datos personales)."]},{"subtitulo":"3. Rama Ejecutiva","parrafos":["<b>Art. 115<\/b>: el Presidente es <b>Jefe de Estado, Jefe del Gobierno y suprema autoridad administrativa<\/b>. El <b>Gobierno nacional<\/b> lo forman el Presidente, los ministros del despacho y los directores de departamentos administrativos; en cada negocio particular, el Presidente y el ministro o director correspondiente constituyen el Gobierno. El Presidente se elige para 4 años y no hay reelección presidencial.","También forman parte de la Rama Ejecutiva las <b>gobernaciones y alcaldías<\/b>, las <b>superintendencias<\/b>, los <b>establecimientos públicos<\/b> y las <b>empresas industriales y comerciales del Estado<\/b>."]},{"subtitulo":"4. Rama Judicial","parrafos":["<b>Art. 116<\/b>: administran justicia la <b>Corte Constitucional<\/b>, la <b>Corte Suprema de Justicia<\/b>, el <b>Consejo de Estado<\/b>, la <b>Comisión Nacional de Disciplina Judicial<\/b>, la <b>Fiscalía General de la Nación<\/b>, los tribunales y los jueces; también la justicia penal militar. El Congreso ejerce algunas funciones judiciales. Excepcionalmente la ley puede atribuir funciones jurisdiccionales a autoridades administrativas en materias precisas, y los <b>particulares<\/b> pueden administrar justicia <b>transitoriamente<\/b> como <b>jurados, conciliadores o árbitros<\/b>.","Ojo: la <b>Procuraduría no hace parte de la Rama Judicial<\/b>; es un órgano de control autónomo, aunque sus agentes intervienen en procesos judiciales."]},{"subtitulo":"5. Estados de excepción (arts. 212–215)","parrafos":["<b>Guerra exterior<\/b> (art. 212). <b>Conmoción interior<\/b> (art. 213): hasta <b>90 días<\/b>, prorrogable hasta por dos periodos iguales; la segunda prórroga requiere <b>concepto previo y favorable del Senado<\/b>. <b>Emergencia económica, social y ecológica<\/b> (art. 215): periodos de hasta <b>30 días<\/b> que, sumados, no pueden exceder <b>90 días en el año calendario<\/b>.","Reglas comunes (art. 214): los decretos legislativos llevan la firma del Presidente y de <b>todos los ministros<\/b>; <b>no pueden suspenderse los derechos humanos ni las libertades fundamentales<\/b>; no se interrumpe el funcionamiento de las ramas ni de los órganos del Estado; y la Corte Constitucional revisa los decretos <b>automáticamente<\/b>."]},{"subtitulo":"6. Organización territorial","parrafos":["<b>Art. 286<\/b>: son entidades territoriales los <b>departamentos, los distritos, los municipios y los territorios indígenas<\/b>; la ley puede darles ese carácter a regiones y provincias. <b>Art. 287<\/b>: gozan de autonomía para gestionar sus intereses dentro de los límites de la Constitución y la ley: gobernarse por autoridades propias, ejercer sus competencias, administrar recursos y establecer tributos, y participar en las rentas nacionales. <b>Art. 311<\/b>: el <b>municipio<\/b> es la entidad fundamental de la división político-administrativa."]}],"conceptos":[{"termino":"Colaboración armónica","definicion":"Los órganos del Estado tienen funciones separadas pero cooperan para cumplir los fines estatales (art. 113)."},{"termino":"Órganos autónomos e independientes","definicion":"Órganos que no pertenecen a ninguna rama: control (Procuraduría, Contraloría), organización electoral, Banco de la República, CNSC, entre otros."},{"termino":"Control político","definicion":"Función del Congreso sobre el Gobierno y la administración (citaciones, debates, moción de censura)."},{"termino":"Ley estatutaria","definicion":"Ley sobre materias del art. 152; requiere mayoría absoluta, una sola legislatura y revisión previa de la Corte."},{"termino":"Gobierno nacional","definicion":"Presidente, ministros del despacho y directores de departamentos administrativos (art. 115)."},{"termino":"Decreto legislativo","definicion":"Decreto con fuerza de ley que expide el Gobierno en estados de excepción; tiene control automático de la Corte."},{"termino":"Principio de legalidad de las competencias (art. 121)","definicion":"Ninguna autoridad puede ejercer funciones distintas de las que le asignan la Constitución y la ley."},{"termino":"Entidad territorial","definicion":"Departamentos, distritos, municipios y territorios indígenas, con autonomía dentro de la Constitución y la ley."}],"confusiones":[{"concepto":"<b>Procuraduría<\/b> (órgano de control)","seConfundeCon":"<b>Fiscalía<\/b> (Rama Judicial)","diferencia":"La Fiscalía investiga delitos y hace parte de la Rama Judicial; la Procuraduría ejerce control disciplinario y no pertenece a ninguna rama."},{"concepto":"Comisión Nacional de <b>Disciplina Judicial<\/b>","seConfundeCon":"Procuraduría (disciplina de servidores)","diferencia":"La Comisión disciplina a funcionarios y empleados de la Rama Judicial y a abogados; la PGN, en general, a los demás servidores públicos."},{"concepto":"Jefe de <b>Estado<\/b>","seConfundeCon":"Jefe de <b>Gobierno<\/b> / suprema autoridad administrativa","diferencia":"En Colombia el Presidente reúne las tres calidades (art. 115)."},{"concepto":"Conmoción interior: <b>90 días<\/b> + 2 prórrogas","seConfundeCon":"Emergencia económica: <b>30 días<\/b>, máx. 90 al año","diferencia":"En conmoción la segunda prórroga requiere concepto favorable del Senado; en emergencia se suman periodos de 30 días hasta 90 en el año."},{"concepto":"Ley <b>estatutaria<\/b>","seConfundeCon":"Ley <b>orgánica<\/b>","diferencia":"Estatutaria: derechos fundamentales, participación, justicia, partidos, estados de excepción. Orgánica: reglamento del Congreso, presupuesto, ordenamiento territorial."},{"concepto":"Consejo Nacional <b>Electoral<\/b>","seConfundeCon":"Consejo de <b>Estado<\/b>","diferencia":"El CNE integra la organización electoral; el Consejo de Estado es tribunal supremo de lo contencioso administrativo (Rama Judicial)."}],"procuraduria":["La Procuraduría es un <b>órgano de control<\/b> autónomo e independiente (arts. 113 y 117): no depende del Presidente ni del Congreso.","El Procurador es elegido por el <b>Senado<\/b> de terna integrada por candidatos del Presidente, la Corte Suprema y el Consejo de Estado: participan las tres ramas (colaboración armónica).","Los agentes del Ministerio Público intervienen ante la Rama Judicial, pero no administran justicia como jueces.","En estados de excepción, la PGN mantiene sus funciones de vigilancia (art. 214: no se interrumpe el funcionamiento de los órganos del Estado).","El art. 121 es la base del deber de todo técnico de actuar solo dentro de las funciones de su cargo."],"altaProbabilidad":["Art. 113: tres ramas + órganos autónomos + colaboración armónica.","Art. 114: Congreso reforma la Constitución, hace las leyes y ejerce control político.","Art. 115: Presidente = Jefe de Estado, de Gobierno y suprema autoridad administrativa.","Art. 116: quiénes administran justicia; particulares como jurados, conciliadores o árbitros.","Art. 117: órganos de control = Ministerio Público y Contraloría. Art. 120: CNE y Registraduría.","Art. 286: entidades territoriales. Art. 214: no se suspenden derechos humanos."],"ejemplos":[{"titulo":"Colaboración armónica","caso":"El Senado elige al Procurador de una terna en la que participan el Presidente, la Corte Suprema y el Consejo de Estado.","analisis":"Las ramas tienen funciones separadas, pero colaboran para integrar un órgano autónomo."},{"titulo":"Art. 121 en la oficina","caso":"Un técnico de una procuraduría regional decide por su cuenta archivar una queja porque le parece infundada.","analisis":"Decidir el archivo no está entre sus funciones: actuaría por fuera de su competencia (art. 121) y con extralimitación (art. 6)."},{"titulo":"Particulares que administran justicia","caso":"Dos empresas pactan que un tribunal de arbitramento resuelva su conflicto contractual.","analisis":"Los árbitros son particulares investidos <b>transitoriamente<\/b> de la función de administrar justicia (art. 116)."}],"repaso":["Ramas: legislativa, ejecutiva, judicial + órganos autónomos (control, electoral, otros).","Órganos de control: Ministerio Público + Contraloría. Electoral: CNE + Registraduría.","Presidente: tres calidades. Gobierno: Presidente + ministros + directores de DA.","Rama Judicial: CC, CSJ, CE, Comisión Nacional de Disciplina Judicial, Fiscalía, tribunales y jueces.","Entidades territoriales: departamentos, distritos, municipios, territorios indígenas."],"preguntas":[{"id":"1.6-01","nivel":1,"tipo":"multiple","enunciado":"Según el artículo 113, son ramas del poder público:","opciones":["La legislativa, la ejecutiva y la judicial.","La legislativa, la ejecutiva y la de control.","La ejecutiva, la judicial y la electoral.","La legislativa, la judicial y la territorial."],"correcta":0,"explicaciones":["Correcto: art. 113.","Los órganos de control son autónomos, no una rama.","La organización electoral es autónoma, no una rama.","La organización territorial no es una rama del poder público."],"concepto":"Ramas del poder público (art. 113)."},{"id":"1.6-02","nivel":1,"tipo":"multiple","enunciado":"De acuerdo con el artículo 115, el Presidente de la República es:","opciones":["Jefe de Estado y jefe del Congreso.","Jefe de Estado, Jefe del Gobierno y suprema autoridad administrativa.","Jefe del Gobierno y suprema autoridad judicial.","Jefe del Gobierno, pero no Jefe de Estado."],"correcta":1,"explicaciones":["El Presidente no es jefe del Congreso.","Correcto: art. 115.","El Presidente no es autoridad judicial.","En Colombia reúne ambas jefaturas."],"concepto":"Calidades del Presidente (art. 115)."},{"id":"1.6-03","nivel":1,"tipo":"multiple","enunciado":"Según el artículo 117, son órganos de control:","opciones":["La Fiscalía y la Contraloría.","El Ministerio Público y la Contraloría General de la República.","La Procuraduría y la Registraduría.","La Defensoría del Pueblo y el Consejo Nacional Electoral."],"correcta":1,"explicaciones":["La Fiscalía hace parte de la Rama Judicial.","Correcto: art. 117.","La Registraduría integra la organización electoral.","La Defensoría hace parte del Ministerio Público, pero el CNE es organización electoral."],"concepto":"Órganos de control (art. 117)."},{"id":"1.6-04","nivel":2,"tipo":"multiple","enunciado":"Según el artículo 114, corresponde al Congreso:","opciones":["Reformar la Constitución, hacer las leyes y ejercer control político sobre el Gobierno y la administración.","Hacer las leyes, administrar justicia y nombrar a los ministros.","Reformar la Constitución, ejercer control fiscal y elegir al Presidente.","Hacer las leyes, ejercer control disciplinario y reglamentar las leyes."],"correcta":0,"explicaciones":["Correcto: art. 114.","Administra justicia la Rama Judicial y los ministros los nombra el Presidente.","El control fiscal es de la Contraloría y el Presidente se elige por voto popular.","El control disciplinario no es función del Congreso respecto de los servidores en general y la reglamentación es del Presidente."],"concepto":"Funciones del Congreso (art. 114)."},{"id":"1.6-05","nivel":2,"tipo":"multiple","enunciado":"La organización electoral está conformada, según el artículo 120, por:","opciones":["El Consejo de Estado y la Registraduría Nacional del Estado Civil.","El Consejo Nacional Electoral, la Registraduría Nacional del Estado Civil y demás organismos que establezca la ley.","El Ministerio del Interior y el Consejo Nacional Electoral.","La Procuraduría Delegada para Asuntos Electorales y la Registraduría."],"correcta":1,"explicaciones":["El Consejo de Estado es de la Rama Judicial.","Correcto: art. 120.","El Ministerio del Interior pertenece a la Rama Ejecutiva.","La Procuraduría es órgano de control, no organización electoral."],"concepto":"Organización electoral (art. 120)."},{"id":"1.6-06","nivel":2,"tipo":"multiple","enunciado":"¿Cuáles son entidades territoriales según el artículo 286?","opciones":["Departamentos, distritos, municipios y territorios indígenas.","Departamentos, municipios, corregimientos y veredas.","Regiones, provincias, departamentos y localidades.","Distritos, municipios, comunas y resguardos."],"correcta":0,"explicaciones":["Correcto: art. 286 (la ley puede dar ese carácter a regiones y provincias).","Corregimientos y veredas son divisiones internas del municipio, no entidades territoriales.","Regiones y provincias solo lo serían si
